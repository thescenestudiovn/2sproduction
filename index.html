    // KHỞI TẠO CÁC SỰ KIỆN KÉO THẢ TRỰC QUAN (DRAG & DROP)
    function initDragAndDropEvents() {
      // 1. KÉO THẢ SẮP XẾP THỨ TỰ CÁC KHỐI NỘI DUNG (BLOCK CMS REORDERING)
      let draggedBlockIdx = null;
      let draggedBlockType = null;
      let draggedBlockId = null;

      document.querySelectorAll('.cms-block-card[draggable="true"]').forEach(card => {
        card.addEventListener('dragstart', e => {
          draggedBlockIdx = Number(card.getAttribute('data-block-idx'));
          draggedBlockType = card.getAttribute('data-type');
          draggedBlockId = card.getAttribute('data-id');
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(draggedBlockIdx));
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.cms-block-card').forEach(c => {
            c.classList.remove('drag-over-top', 'drag-over-bottom');
          });
        });

        card.addEventListener('dragover', e => {
          if (e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const rect = card.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          card.classList.remove('drag-over-top', 'drag-over-bottom');
          if (e.clientY < mid) {
            card.classList.add('drag-over-top');
          } else {
            card.classList.add('drag-over-bottom');
          }
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        card.addEventListener('drop', e => {
          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) return;
          e.preventDefault();
          const targetIdx = Number(card.getAttribute('data-block-idx'));
          card.classList.remove('drag-over-top', 'drag-over-bottom');
          if (draggedBlockIdx === null || draggedBlockIdx === targetIdx) return;
          const item = getTargetItem(draggedBlockType, draggedBlockId);
          if (item && item.blocks) {
            const movedItem = item.blocks.splice(draggedBlockIdx, 1)[0];
            item.blocks.splice(targetIdx, 0, movedItem);
            saveCMSData(cms);
            render();
            showCmsToast(`Đã chuyển khối đến vị trí #${targetIdx + 1}`);
          }
        });
      });

      // 2. KÉO THẢ SẮP XẾP THỨ TỰ CÁC MỤC TRANG CHỦ (HOME SECTIONS REORDERING)
      let draggedSecIdx = null;
      document.querySelectorAll('.section-drag-item[draggable="true"]').forEach(card => {
        card.addEventListener('dragstart', e => {
          draggedSecIdx = Number(card.getAttribute('data-sec-idx'));
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.section-drag-item').forEach(c => c.classList.remove('drag-over'));
        });
        card.addEventListener('dragover', e => {
          e.preventDefault();
          card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });
        card.addEventListener('drop', e => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const targetSecIdx = Number(card.getAttribute('data-sec-idx'));
          if (draggedSecIdx === null || draggedSecIdx === targetSecIdx) return;
          const h = cms.home || DEFAULT_DATA.home;
          const lay = h.layout || DEFAULT_DATA.home.layout;
          const order = (Array.isArray(lay.sectionOrder) && lay.sectionOrder.length)
            ? lay.sectionOrder
            : DEFAULT_DATA.home.layout.sectionOrder.slice();
          const movedSec = order.splice(draggedSecIdx, 1)[0];
          order.splice(targetSecIdx, 0, movedSec);
          lay.sectionOrder = order;
          h.layout = lay;
          cms.home = h;
          saveCMSData(cms);
          render();
          showCmsToast('Đã sắp xếp lại thứ tự các mục trang chủ!');
        });
      });

      // 3. KÉO THẢ TỆP ẢNH TRỰC TIẾP TỪ MÁY TÍNH VÀO DROPZONE (NATIVE FILE DROP)
      document.querySelectorAll('.image-dropzone').forEach(zone => {
        zone.addEventListener('dragover', e => {
          if (e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files')) {
            e.preventDefault();
            e.stopPropagation();
            zone.classList.add('drag-active');
          }
        });
        zone.addEventListener('dragleave', e => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.remove('drag-active');
        });
        zone.addEventListener('drop', async e => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.remove('drag-active');
          const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
          if (!files.length) return;

          const type = zone.getAttribute('data-drop-type');
          const id = zone.getAttribute('data-drop-id');
          const idx = zone.getAttribute('data-drop-idx') !== null ? Number(zone.getAttribute('data-drop-idx')) : null;
          const isGallery = zone.getAttribute('data-drop-gallery') === '1';
          const targetField = zone.getAttribute('data-drop-field');

          showCmsToast(`Đang tải lên ${files.length} ảnh...`);

          if (targetField === 'slide') {
            const slideIdx = Number(zone.getAttribute('data-slide-idx'));
            const url = await processUploadedImageFile(files[0]);
            if (cms.home && cms.home.slides && cms.home.slides[slideIdx]) {
              cms.home.slides[slideIdx].image = url;
              saveCMSData(cms);
              render();
              showCmsToast(`Đã thay ảnh Slide #${slideIdx + 1} thành công!`);
            }
            return;
          }

          if (targetField === 'client-photo') {
            const cIdx = Number(zone.getAttribute('data-client-idx'));
            const url = await processUploadedImageFile(files[0]);
            if (cms.home && cms.home.clients && cms.home.clients[cIdx]) {
              cms.home.clients[cIdx].bgPhoto = url;
              saveCMSData(cms);
              render();
              showCmsToast('Đã đổi ảnh nền đối tác!');
            }
            return;
          }

          if (targetField === 'client-logo') {
            const cIdx = Number(zone.getAttribute('data-client-idx'));
            const url = await processUploadedImageFile(files[0]);
            if (cms.home && cms.home.clients && cms.home.clients[cIdx]) {
              cms.home.clients[cIdx].logo = url;
              saveCMSData(cms);
              render();
              showCmsToast('Đã đổi logo đối tác!');
            }
            return;
          }

          if (targetField === 'cover') {
            const url = await processUploadedImageFile(files[0]);
            if (type === 'service') {
              const srv = cms.services.find(x => x.id === id);
              if (srv) { srv.image = url; saveCMSData(cms); render(); showCmsToast('Đã đổi ảnh bìa dịch vụ!'); }
            } else if (type === 'work') {
              const w = cms.works.find(x => x.id === id);
              if (w) { w.image = url; saveCMSData(cms); render(); showCmsToast('Đã đổi ảnh bìa dự án!'); }
            } else if (type === 'article') {
              const a = (cms.articles || []).find(x => x.id === id);
              if (a) { a.coverImage = url; a.image = url; saveCMSData(cms); render(); showCmsToast('Đã đổi ảnh bìa tin tức!'); }
            }
            return;
          }

          // Block image or gallery
          const item = getTargetItem(type, id);
          if (!item || !item.blocks || idx === null || !item.blocks[idx]) return;

          if (isGallery) {
            const urls = [];
            for (const f of files) {
              const u = await processUploadedImageFile(f);
              urls.push(u);
            }
            item.blocks[idx].images = (item.blocks[idx].images || []).concat(urls);
            saveCMSData(cms);
            render();
            showCmsToast(`Đã thêm ${urls.length} ảnh vào bộ sưu tập!`);
          } else {
            const url = await processUploadedImageFile(files[0]);
            item.blocks[idx].url = url;
            saveCMSData(cms);
            render();
            showCmsToast('Đã thay thế ảnh thành công!');
          }
        });
      });
    }

    // Hỗ trợ vuốt tay chuyển slide Hero trên điện thoại và tablet
    let heroTouchStartX = 0;
    let heroTouchEndX = 0;
    document.addEventListener('touchstart', e => {
      if (e.target.closest('.mockup-hero')) {
        heroTouchStartX = e.changedTouches[0].screenX;
      }
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (!e.target.closest('.mockup-hero')) return;
      heroTouchEndX = e.changedTouches[0].screenX;
      const diff = heroTouchEndX - heroTouchStartX;
      if (Math.abs(diff) > 40) {
        const slides = (cms.home && cms.home.slides && cms.home.slides.length) ? cms.home.slides : DEFAULT_DATA.home.slides;
        if (diff < 0) {
          state.activeHeroIdx = (state.activeHeroIdx + 1) % slides.length;
        } else {
          state.activeHeroIdx = (state.activeHeroIdx - 1 + slides.length) % slides.length;
        }
        render();
      }
    }, { passive: true });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && (state.lightboxIdx !== null || state.directLightboxPhoto)) {
        state.lightboxIdx = null;
        state.directLightboxPhoto = null;
        renderLightboxPortal();
      }
    });

    document.addEventListener('click', e => {
      // Đóng menu Speed Dial nếu click ra ngoài
      if (!e.target.closest('#floatingFabContainer')) {
        const fab = document.getElementById('floatingFabContainer');
        if (fab && fab.classList.contains('open')) fab.classList.remove('open');
      }

      const actEl = e.target.closest('[data-action]');
      const navEl = e.target.closest('[data-nav]');
      // Nếu người dùng bấm vào nút hành động bên trong một thẻ có data-nav (ví dụ bấm xem ảnh ⤢ hoặc đổi ảnh 📷 bên trong thẻ dự án), ưu tiên thực thi data-action!
      if (navEl && (!actEl || !navEl.contains(actEl))) {
        e.preventDefault();
        navigate(navEl.getAttribute('data-nav'), navEl.getAttribute('data-id') || null);
        return;
      }

      if (!actEl) return;
      const action = actEl.getAttribute('data-action');

      if (action === 'toggle-contact-dock') {
        const fab = document.getElementById('floatingFabContainer');
        if (fab) fab.classList.toggle('open');
        return;
      }

      if (action === 'scroll-to-top') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (action === 'prev-hero-slide') {
        const slides = (cms.home && cms.home.slides && cms.home.slides.length) ? cms.home.slides : DEFAULT_DATA.home.slides;
        state.activeHeroIdx = (state.activeHeroIdx - 1 + slides.length) % slides.length;
        render();
        return;
      } else if (action === 'next-hero-slide') {
        const slides = (cms.home && cms.home.slides && cms.home.slides.length) ? cms.home.slides : DEFAULT_DATA.home.slides;
        state.activeHeroIdx = (state.activeHeroIdx + 1) % slides.length;
        render();
        return;
      } else if (action === 'go-hero-slide') {
        state.activeHeroIdx = Number(actEl.getAttribute('data-idx'));
        render();
        return;
      }

      if (action === 'change-clients-bg-img') {
        pickSingleImage(url => {
          if (!cms.home) cms.home = JSON.parse(JSON.stringify(DEFAULT_DATA.home));
          cms.home.clientsBgImage = url;
          cms.home.clientsShowBg = true;
          saveCMSData(cms);
          render();
        });
        return;
      } else if (action === 'toggle-clients-bg') {
        if (!cms.home) cms.home = JSON.parse(JSON.stringify(DEFAULT_DATA.home));
        cms.home.clientsShowBg = cms.home.clientsShowBg === false ? true : false;
        saveCMSData(cms);
        render();
        return;
      } else if (action === 'quick-add-client') {
        if (!cms.home) cms.home = JSON.parse(JSON.stringify(DEFAULT_DATA.home));
        if (!Array.isArray(cms.home.clients)) cms.home.clients = JSON.parse(JSON.stringify(DEFAULT_DATA.home.clients));
        cms.home.clients.push({
          id: 'c' + Date.now(),
          name: 'NEW PARTNER',
          sub: 'Enterprise',
          logo: '',
          photo: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=600&q=80'
        });
        saveCMSData(cms);
        render();
        return;
      } else if (action === 'change-client-photo') {
        const idx = parseInt(actEl.getAttribute('data-idx'), 10);
        pickSingleImage(url => {
          if (!cms.home) cms.home = JSON.parse(JSON.stringify(DEFAULT_DATA.home));
          if (!Array.isArray(cms.home.clients)) cms.home.clients = JSON.parse(JSON.stringify(DEFAULT_DATA.home.clients));
          if (cms.home.clients[idx]) cms.home.clients[idx].photo = url;
          saveCMSData(cms);
          render();
        });
        return;
      } else if (action === 'change-client-logo') {
        const idx = parseInt(actEl.getAttribute('data-idx'), 10);
        pickSingleImage(url => {
          if (!cms.home) cms.home = JSON.parse(JSON.stringify(DEFAULT_DATA.home));
          if (!Array.isArray(cms.home.clients)) cms.home.clients = JSON.parse(JSON.stringify(DEFAULT_DATA.home.clients));
          if (cms.home.clients[idx]) cms.home.clients[idx].logo = url;
          saveCMSData(cms);
          render();
        });
        return;
      } else if (action === 'delete-client') {
        const idx = parseInt(actEl.getAttribute('data-idx'), 10);
        if (confirm('Xóa đối tác này khỏi danh sách?')) {
          if (!cms.home) cms.home = JSON.parse(JSON.stringify(DEFAULT_DATA.home));
          if (!Array.isArray(cms.home.clients)) cms.home.clients = JSON.parse(JSON.stringify(DEFAULT_DATA.home.clients));
          cms.home.clients.splice(idx, 1);
          saveCMSData(cms);
          render();
        }
        return;
      } else if (action === 'toggle-lang') {
        state.lang = state.lang === 'vi' ? 'en' : 'vi';
        try { localStorage.setItem('2S_LANG', state.lang); } catch(e){}
        render();
      } else if (action === 'toggle-mobile-menu') {
        state.mobileMenuOpen = !state.mobileMenuOpen;
        render();
      } else if (action === 'toggle-bg-panel') {
        if (!state.isAdminLoggedIn) return;
        state.bgPanelOpen = !state.bgPanelOpen;
        render();
      } else if (action === 'select-ambient-bg') {
        if (!state.isAdminLoggedIn) return;
        const url = actEl.getAttribute('data-url');
        cms.settings.ambientBgUrl = url;
        cms.settings.ambientAutoScroll = false;
        saveCMSData(cms);
        syncAmbientBackgroundDOM(url);
        render();
      } else if (action === 'upload-ambient-bg') {
        if (!state.isAdminLoggedIn) return;
        triggerSingleImageUpload((uploadedUrl) => {
          cms.settings.ambientBgUrl = uploadedUrl;
          cms.settings.ambientAutoScroll = false;
          saveCMSData(cms);
          syncAmbientBackgroundDOM(uploadedUrl);
          render();
        });
      } else if (action === 'set-ambient-blur') {
        if (!state.isAdminLoggedIn) return;
        const blur = Number(actEl.getAttribute('data-blur'));
        cms.settings.ambientBlurPx = blur;
        saveCMSData(cms);
        syncAmbientBackgroundDOM();
        render();
      } else if (action === 'toggle-ambient-autoscroll') {
        if (!state.isAdminLoggedIn) return;
        cms.settings.ambientAutoScroll = !cms.settings.ambientAutoScroll;
        saveCMSData(cms);
        render();
      } else if (action === 'hero-slide') {
        state.activeHeroIdx = Number(actEl.getAttribute('data-idx'));
        const slides = (cms.home && cms.home.slides && cms.home.slides.length) ? cms.home.slides : DEFAULT_DATA.home.slides;
        const slide = slides[state.activeHeroIdx];
        if (slide) syncAmbientBackgroundDOM(slide.image);
        render();
      } else if (action === 'toggle-home-vis') {
        if (!state.isAdminLoggedIn) return;
        const sec = actEl.getAttribute('data-sec');
        cms.home.visibility = cms.home.visibility || {};
        cms.home.visibility[sec] = cms.home.visibility[sec] === false ? true : false;
        saveCMSData(cms);
        render();
      } else if (action === 'set-home-layout') {
        if (!state.isAdminLoggedIn) return;
        const key = actEl.getAttribute('data-key');
        const val = actEl.getAttribute('data-val');
        cms.home.layout = cms.home.layout || { ...DEFAULT_DATA.home.layout };
        cms.home.layout[key] = val;
        saveCMSData(cms);
        render();
      } else if (action === 'move-home-section') {
        if (!state.isAdminLoggedIn) return;
        const sec = actEl.getAttribute('data-sec');
        const dir = Number(actEl.getAttribute('data-dir'));
        cms.home.layout = cms.home.layout || { ...DEFAULT_DATA.home.layout };
        const order = Array.isArray(cms.home.layout.sectionOrder)
          ? [...cms.home.layout.sectionOrder]
          : [...DEFAULT_DATA.home.layout.sectionOrder];
        const idx = order.indexOf(sec);
        const targetIdx = idx + dir;
        if (idx !== -1 && targetIdx >= 0 && targetIdx < order.length) {
          const tmp = order[idx];
          order[idx] = order[targetIdx];
          order[targetIdx] = tmp;
          cms.home.layout.sectionOrder = order;
          saveCMSData(cms);
          render();
        }
      } else if (action === 'change-home-slide-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const idx = Number(actEl.getAttribute('data-idx'));
        triggerSingleImageUpload((uploadedUrl) => {
          if (cms.home && cms.home.slides && cms.home.slides[idx]) {
            cms.home.slides[idx].image = uploadedUrl;
            saveCMSData(cms);
            syncAmbientBackgroundDOM(uploadedUrl);
            render();
          }
        });
      } else if (action === 'change-approach-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        triggerSingleImageUpload((uploadedUrl) => {
          cms.home.approach = cms.home.approach || { ...DEFAULT_DATA.home.approach };
          cms.home.approach.image = uploadedUrl;
          cms.home.approach.showImage = true;
          saveCMSData(cms);
          render();
        });
      } else if (action === 'toggle-approach-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        cms.home.approach = cms.home.approach || { ...DEFAULT_DATA.home.approach };
        cms.home.approach.showImage = cms.home.approach.showImage === false ? true : false;
        saveCMSData(cms);
        render();
      } else if (action === 'filter-lookbook') {
        state.lookbookFilter = actEl.getAttribute('data-val');
        state.lightboxIdx = null;
        state.directLightboxPhoto = null;
        renderLightboxPortal();
        render();
      } else if (action === 'open-lightbox') {
        e.stopPropagation();
        state.directLightboxPhoto = null;
        state.lightboxIdx = Number(actEl.getAttribute('data-idx'));
        renderLightboxPortal();
      } else if (action === 'open-photo-direct') {
        e.stopPropagation();
        state.lightboxIdx = null;
        state.directLightboxPhoto = {
          url: actEl.getAttribute('data-url'),
          title: actEl.getAttribute('data-title') || 'Hình Ảnh Thực Tế — 2S PRODUCTION',
          catLabel: actEl.getAttribute('data-cat') || '2S PRODUCTION • VISUAL SHOWCASE',
          sub: actEl.getAttribute('data-sub') || ''
        };
        renderLightboxPortal();
      } else if (action === 'close-lightbox') {
        state.lightboxIdx = null;
        state.directLightboxPhoto = null;
        renderLightboxPortal();
      } else if (action === 'close-lightbox-backdrop') {
        if (e.target.classList.contains('lightbox-backdrop')) {
          state.lightboxIdx = null;
          state.directLightboxPhoto = null;
          renderLightboxPortal();
        }
      } else if (action === 'lightbox-prev' || action === 'lightbox-next') {
        const allLb = (cms.home && cms.home.lookbook && cms.home.lookbook.length) ? cms.home.lookbook : DEFAULT_DATA.home.lookbook;
        const list = state.lookbookFilter === 'all' ? allLb : allLb.filter(x => x.catKey === state.lookbookFilter);
        if (!list.length) return;
        const cur = state.lightboxIdx || 0;
        state.lightboxIdx = action === 'lightbox-next'
          ? (cur + 1) % list.length
          : (cur - 1 + list.length) % list.length;
        renderLightboxPortal();
      } else if (action === 'add-lookbook-photos') {
        if (!state.isAdminLoggedIn) return;
        triggerMultiImageUpload((uploadedUrls) => {
          cms.home.lookbook = cms.home.lookbook || [];
          uploadedUrls.forEach((u, i) => {
            cms.home.lookbook.unshift({
              id: 'lb-' + Date.now() + '-' + i,
              catKey: state.lookbookFilter === 'all' ? 'stage' : state.lookbookFilter,
              catLabel: 'SÂN KHẤU & HÌNH ẢNH THỰC TẾ 2S PRODUCTION',
              title: 'Hình Ảnh Sự Kiện & Thi Công Thực Tế Mới',
              sub: '2S PRODUCTION • CÔNG TY TNHH 2S PLANNER',
              spanClass: 'span-6',
              url: u
            });
          });
          saveCMSData(cms);
          render();
        });
      } else if (action === 'replace-lookbook-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const id = actEl.getAttribute('data-id');
        triggerSingleImageUpload((uploadedUrl) => {
          if (cms.home && Array.isArray(cms.home.lookbook)) {
            const item = cms.home.lookbook.find(x => x.id === id);
            if (item) {
              item.url = uploadedUrl;
              saveCMSData(cms);
              render();
            }
          }
        });
      } else if (action === 'move-lookbook-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const id = actEl.getAttribute('data-id');
        const dir = Number(actEl.getAttribute('data-dir'));
        if (cms.home && Array.isArray(cms.home.lookbook)) {
          const idx = cms.home.lookbook.findIndex(x => x.id === id);
          const targetIdx = idx + dir;
          if (idx !== -1 && targetIdx >= 0 && targetIdx < cms.home.lookbook.length) {
            const tmp = cms.home.lookbook[idx];
            cms.home.lookbook[idx] = cms.home.lookbook[targetIdx];
            cms.home.lookbook[targetIdx] = tmp;
            saveCMSData(cms);
            render();
          }
        }
      } else if (action === 'delete-lookbook-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const id = actEl.getAttribute('data-id');
        if (cms.home && Array.isArray(cms.home.lookbook)) {
          cms.home.lookbook = cms.home.lookbook.filter(x => x.id !== id);
          saveCMSData(cms);
          render();
        }
      } else if (action === 'toggle-service-span') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const id = actEl.getAttribute('data-id');
        const srv = cms.services.find(x => x.id === id);
        if (srv) {
          srv.fullSpan = !srv.fullSpan;
          saveCMSData(cms);
          render();
        }
      } else if (action === 'move-service-item') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const idx = Number(actEl.getAttribute('data-idx'));
        const dir = Number(actEl.getAttribute('data-dir'));
        const targetIdx = idx + dir;
        if (idx >= 0 && targetIdx >= 0 && targetIdx < cms.services.length) {
          const tmp = cms.services[idx];
          cms.services[idx] = cms.services[targetIdx];
          cms.services[targetIdx] = tmp;
          saveCMSData(cms);
          render();
        }
      } else if (action === 'move-work-item') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const idx = Number(actEl.getAttribute('data-idx'));
        const dir = Number(actEl.getAttribute('data-dir'));
        const targetIdx = idx + dir;
        if (idx >= 0 && targetIdx >= 0 && targetIdx < cms.works.length) {
          const tmp = cms.works[idx];
          cms.works[idx] = cms.works[targetIdx];
          cms.works[targetIdx] = tmp;
          saveCMSData(cms);
          render();
        }
      } else if (action === 'add-work-mini-photo') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const id = actEl.getAttribute('data-id');
        triggerMultiImageUpload((uploadedUrls) => {
          const w = cms.works.find(x => x.id === id);
          if (w) {
            w.blocks = w.blocks || [];
            let gal = w.blocks.find(b => b.type === 'gallery');
            if (!gal) {
              gal = { type: 'gallery', images: [], caption: 'Thư viện ảnh thực tế dự án' };
              w.blocks.push(gal);
            }
            gal.images = (uploadedUrls || []).concat(gal.images || []);
            saveCMSData(cms);
            render();
          }
        });
      } else if (action === 'replace-work-mini-photo') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const id = actEl.getAttribute('data-id');
        const oldUrl = actEl.getAttribute('data-old-url');
        triggerSingleImageUpload((uploadedUrl) => {
          const w = cms.works.find(x => x.id === id);
          if (w) {
            if (w.image === oldUrl) {
              w.image = uploadedUrl;
            }
            (w.blocks || []).forEach(b => {
              if (b.type === 'image' && b.url === oldUrl) b.url = uploadedUrl;
              if (b.type === 'gallery' && Array.isArray(b.images)) {
                b.images = b.images.map(u => u === oldUrl ? uploadedUrl : u);
              }
            });
            saveCMSData(cms);
            render();
          }
        });
      } else if (action === 'block-replace-gallery-img') {
        if (!state.isAdminLoggedIn) return;
        e.stopPropagation();
        const type = actEl.getAttribute('data-type');
        const id = actEl.getAttribute('data-id');
        const idx = Number(actEl.getAttribute('data-idx'));
        const gIdx = Number(actEl.getAttribute('data-gidx'));
        triggerSingleImageUpload((uploadedUrl) => {
          const item = getTargetItem(type, id);
          if (item && item.blocks && item.blocks[idx] && Array.isArray(item.blocks[idx].images)) {
            item.blocks[idx].images[gIdx] = uploadedUrl;
            saveCMSData(cms);
            render();
          }
        });
      } else if (action === 'filter-news') {
        state.newsFilter = actEl.getAttribute('data-val');
        render();
      } else if (action === 'quick-create-article') {
        if (!state.isAdminLoggedIn) return;
        triggerSingleImageUpload((uploadedUrl) => {
          const newId = 'art-' + Date.now();
          const newArt = {
            id: newId,
            categoryKey: 'experience',
            category: 'Kinh Nghiệm Sự Kiện',
            date: new Date().toLocaleDateString('vi-VN'),
            readTime: '5 phút đọc',
            author: '2S PRODUCTION',
            title: 'Tiêu Đề Bài Viết Chuyên Đề Mới ' + new Date().toLocaleDateString('vi-VN'),
            image: uploadedUrl,
            summary: 'Tóm tắt nội dung bài viết chuyên đề sự kiện mới...',
            blocks: [
              { type: 'heading', text: 'Nội Dung Chính Của Bài Viết' },
              { type: 'text', text: 'Nhập nội dung chi tiết bài viết tại đây...' }
            ]
          };
          cms.articles = cms.articles || [];
          cms.articles.unshift(newArt);
          saveCMSData(cms);
          navigate('news-detail', newId);
        });
      } else if (action === 'change-cover-article') {
        if (!state.isAdminLoggedIn) return;
        const id = actEl.getAttribute('data-id');
        triggerSingleImageUpload((uploadedUrl) => {

        const idx = Number(actEl.getAttribute('data-idx'));
        const gIdx = Number(actEl.getAttribute('data-gidx'));
        const item = getTargetItem(type, id);
        if (item && item.blocks && item.blocks[idx] && item.blocks[idx].images) {
          item.blocks[idx].images.splice(gIdx, 1);
          saveCMSData(cms);
          render();
        }
      } else if (action === 'admin-delete-service') {
        if (!state.isAdminLoggedIn) return;
        const id = actEl.getAttribute('data-id');
        if (confirm('Xóa bài viết dịch vụ này?')) {
          cms.services = cms.services.filter(x => x.id !== id);
          saveCMSData(cms);
          render();
        }
      } else if (action === 'admin-delete-work') {
        if (!state.isAdminLoggedIn) return;
        const id = actEl.getAttribute('data-id');
        if (confirm('Xóa dự án này khỏi Our Work?')) {
          cms.works = cms.works.filter(x => x.id !== id);
          saveCMSData(cms);
          render();
        }
      } else if (action === 'reset-default-data') {
        if (!state.isAdminLoggedIn) return;
        if (confirm('Khôi phục toàn bộ dữ liệu gốc?')) {
          localStorage.removeItem(STORAGE_KEY);
          cms = loadCMSData();
          render();
        }
      }
    });

    render();
  </script>
</body>
</html>
