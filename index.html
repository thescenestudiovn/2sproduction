                                "text": "Bãi biển Đà Nẵng – với dải cát trắng mịn thoai thoải, làn nước trong xanh và không gian rộng lớn tại Mỹ Khê, Non Nước – luôn là thánh địa lý tưởng số 1 Việt Nam cho các chương trình <span class=\"kw-highlight\">Team Building bãi biển</span> của các tập đoàn trong và ngoài nước.\n\nTuy nhiên, một chương trình team building thành công không đơn thuần là những trò chơi chạy nhảy giải trí thông thường. Đó phải là một hành trình được thiết kế bài bản, kết hợp giữa yếu tố giải phóng năng lượng thể chất, kích thích tư duy chiến lược và thắt chặt tinh thần đồng đội. Dưới đây là bộ giáo án chi tiết <span class=\"kw-highlight\">Top 10 trò chơi team building bãi biển độc quyền</span> được đội ngũ 2S PRODUCTION nghiên cứu, chuẩn hóa và tổ chức thành công cho hàng trăm doanh nghiệp tại Đà Nẵng."

                        {
                                "type": "paragraph",
                                "text": "### PHẦN I: CÁC TRÒ CHƠI PHÁ BĂNG & TỐC ĐỘ VẬN ĐỘNG\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">01</div>\n    <div class=\"article-step-title\">Bánh Xe Khổng Lồ Đồng Tâm – Bài Học Về Tính Kỷ Luật & Nhịp Điệu</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Bạt bọc hình tròn khép kín đường kính 2.5m</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: 8–10 thành viên/lượt</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 10 phút/vòng</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Phối hợp nhịp nhàng & Thống nhất chỉ huy</span>\n  </div>\n  <p><strong>Mô tả chi tiết & Thể lệ thi đấu:</strong> Các thành viên cùng bước vào bên trong một dải bạt tròn khép kín tạo thành một chiếc 'bánh xe tăng khổng lồ'. Khi có hiệu lệnh của trọng tài, toàn đội phải dùng tay đẩy mép bạt phía trên và bước chân nhịp nhàng phía dưới để lăn bánh xe tiến về vạch đích cách đó 30 mét mà không ai bị ngã hoặc bước ra ngoài dải bạt.</p>\n  <p><strong>Bí quyết giành chiến thắng:</strong> Đội ngũ cần bầu ra một người đội trưởng đứng ở góc ngoài cùng hô khẩu hiệu '1 - 2, 1 - 2' để toàn đội bước đều chân. Nếu một cá nhân bước quá nhanh hoặc quá chậm so với tốc độ chung, bánh xe sẽ lập tức bị kẹt hoặc đứt gãy nhịp tiến.</p>\n  <div class=\"article-callout tip\">💡 <strong>Bài Học Quản Trị Từ 2S PRODUCTION:</strong> Một doanh nghiệp chỉ có thể phát triển vững mạnh khi toàn bộ các phòng ban vận hành cùng một nhịp độ. Sự nỗ lực đơn lẻ tách rời khỏi quy chuẩn tập thể sẽ làm chậm tiến độ của cả cỗ máy tổ chức.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">02</div>\n    <div class=\"article-step-title\">Đưa Nước Về Nguồn – Tối Ưu Hóa Dòng Chảy Tài Nguyên & Quản Trị Rủi Ro</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Máng nước nhựa PVC bổ đôi (dài 1m), xô nước, cốc đong</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: Toàn đội 15–20 thành viên</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 12 phút</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Chuyển giao thông suốt & Giảm thiểu hao phí</span>\n  </div>\n  <p><strong>Mô tả chi tiết & Thể lệ thi đấu:</strong> Mỗi thành viên cầm một máng nhựa PVC ghép nối liên tiếp tạo thành một đường ống dẫn nước từ mép sóng biển về thùng chứa lớn đặt trên bờ cát (khoảng cách 25m). Người lấy nước múc cốc nước biển rót vào máng đầu tiên. Khi dòng nước chảy qua máng của mình, thành viên đó phải lập tức chạy nhanh xuống cuối hàng để nối tiếp máng nước, tạo thành một chu trình khép kín không gián đoạn.</p>\n  <p><strong>Bí quyết giành chiến thắng:</strong> Các mối nối giữa hai thanh máng phải được giữ thật khít và có độ dốc vừa phải. Nếu người chuyển máng làm rơi hoặc nghiêng máng quá đà, dòng nước sẽ bị tràn ra bãi cát và lãng phí toàn bộ công sức.</p>\n  <div class=\"article-callout tip\">💡 <strong>Bài Học Quản Trị:</strong> Nước là tài nguyên, tương đương nguồn lực tài chính và thông tin của công ty. Điểm nghẽn giao tiếp giữa các bộ phận (Silo Effect) chính là nguyên nhân làm thất thoát tài nguyên doanh nghiệp nhiều nhất.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">03</div>\n    <div class=\"article-step-title\">Cầu Cạn Vượt Biển Sâu – Niềm Tin Tuyệt Đối Vào Người Dẫn Dắt</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Dây thừng bảo hộ, cáng gỗ, cờ tiêu điểm</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: 12–15 thành viên</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 15 phút</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Xây dựng lòng tin (Trust Building) & Tinh thần dấn thân</span>\n  </div>\n  <p><strong>Mô tả chi tiết & Thể lệ thi đấu:</strong> Hai hàng thành viên đối diện nhau ngồi đan tay hoặc dùng các thanh giằng vững chắc để tạo thành một cây 'cầu người' cao 1 mét so với mặt cát. Một thành viên đại diện (thường là đội trưởng hoặc thành viên xung phong) sẽ bước đi trên đôi tay và vai của các đồng đội để tiến thẳng về vạch đích mà chân không chạm cát.</p>\n  <p><strong>Bí quyết giành chiến thắng:</strong> Những người làm trụ cầu phải ghì chặt trọng tâm cơ thể, vững như bàn thạch. Người bước đi trên cầu cần duy trì tốc độ ổn định và gửi gắm trọn vẹn niềm tin vào sức mạnh nâng đỡ của đồng đội phía dưới.</p>\n  <div class=\"article-callout info\">📋 <strong>Tiêu Chuẩn An Toàn 2S PRODUCTION:</strong> Chúng tôi luôn bố trí lớp đệm khí cứu hộ và 4 nhân viên an ninh sự kiện túc trực bên dưới để hỗ trợ người chơi, đảm bảo an toàn 100% không để xảy ra chấn thương.</div>\n</div>"
                        },
                        {
                                "type": "paragraph",
                                "text": "### PHẦN II: CÁC TRÒ CHƠI PHỐI HỢP CHIẾN LƯỢC & SỨC MẠNH TẬP THỂ\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">Bóng Lăn Khổng Lồ Tiếp Sức – Chinh Phục Chướng Ngại Vật Địa Hình Cát</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Quả cầu hơi khổng lồ đường kính 2m rực rỡ sắc màu</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: 6 thành viên/lượt</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 10 phút</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Bứt phá giới hạn & Quản lý trọng lực gió biển</span>\n  </div>\n  <p><strong>Mô tả chi tiết:</strong> Các thành viên cùng nhau đẩy quả bóng hơi khổng lồ vượt qua các chướng ngại vật dốc cát, lượn qua các cọc tiêu zíc zắc và đưa bóng về đích an toàn. Trên bãi biển lộng gió, sức cản của gió biển và ma sát cát sẽ là thử thách cực lớn đối với sức bền của các thành viên.</p>\n  <p><strong>Chiến lược thành công:</strong> Phân bổ vị trí người có thể lực tốt nhất ở phía sau để tạo lực đẩy chính, hai người có độ khéo léo cao ở hai bên hông để điều hướng bánh lái quả bóng tránh chệch khỏi làn quy định.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">05</div>\n    <div class=\"article-step-title\">Đôi Hài Vạn Dặm (Ván Trượt Đồng Đội) – Đồng Lòng Đồng Hướng</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Bộ ván trượt gỗ gắn 5 cặp quai dây dù chắc chắn</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: 5 người/bộ</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 10 phút</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Tính nhất quán & Đồng bộ hóa hành động</span>\n  </div>\n  <p><strong>Mô tả chi tiết:</strong> 5 thành viên cùng xỏ chân vào hai thanh ván gỗ dài 3m có gắn quai dù. Cả 5 người phải cùng nhấc chân trái, cùng bước chân phải để di chuyển tấm ván trên bề mặt cát lún. Chỉ cần một người đi lệch một nhịp, cả đội sẽ bị ghì chặt tại chỗ và không thể tiến thêm một centimet nào.</p>\n  <div class=\"article-callout tip\">💡 <strong>Bài Học Quản Trị:</strong> Chiến lược kinh doanh dù có hay đến mấy nhưng nếu các nhân sự thực thi lệch pha nhau thì toàn bộ kế hoạch sẽ bị tê liệt hoàn toàn.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">06</div>\n    <div class=\"article-step-title\">Trận Địa Pháo Binh Bãi Biển – Thử Thách Căn Chỉnh Góc Nhìn & Độ Chính Xác</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Bạt co giãn 4 góc, bóng tennis, rổ đựng tiêu điểm</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: 4 thành viên cầm bạt + 1 người nhặt bóng</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 8 phút</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Căn chỉnh lực kéo & Phối hợp góc nhìn 360 độ</span>\n  </div>\n  <p><strong>Mô tả chi tiết:</strong> 4 thành viên nắm 4 góc tấm bạt đàn hồi để hất tung quả bóng tennis bay qua lưới sang cho đồng đội bên kia hứng trúng vào chiếc xô đựng. Trò chơi đòi hỏi khả năng làm chủ lực giật và kiểm soát hướng gió biển một cách chuẩn xác.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">07</div>\n    <div class=\"article-step-title\">Bánh Xe Bất Tận (Con Đường Thành Công) – Chuỗi Cung Ứng Thông Suốt</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: Tấm thảm bạt dài, thanh tre nhôm chịu lực</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: 10 thành viên</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 12 phút</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Tối ưu quy trình & Không để đứt gãy vận hành</span>\n  </div>\n  <p><strong>Mô tả chi tiết:</strong> Đội chơi dùng các con lăn chuyển động liên tục dưới một tấm bạt để đẩy đội trưởng ngồi trên bạt lướt đi băng băng trên mặt cát. Người ở phía sau nhặt con lăn chuyền lên phía trước tạo thành đường băng chuyển động liên hoàn.</p>\n</div>"

 cầm ngọn cờ hoặc đuốc biểu trưng tiến về vị trí trung tâm. Toàn bộ thành viên còn lại tạo thành bức tường thành kiên cố để che chắn trước làn mưa bóng nước từ phía 'thử thách ngoại cảnh'. Ngọn cờ phải luôn đứng thẳng hiên ngang cho đến giây cuối cùng.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">10</div>\n    <div class=\"article-step-title\">Bức Tranh Ghép Logo Khổng Lồ (The Big Picture) – Tự Hào Thương Hiệu Đỉnh Cao</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🎪 Đạo cụ: 20-50 mảnh ghép tranh khổ lớn in UV sắc nét, Flycam 4K</span>\n    <span class=\"article-meta-badge\">👥 Đội hình: Toàn bộ cán bộ nhân viên (50 - 500 khách)</span>\n    <span class=\"article-meta-badge\">⏱️ Thời lượng: 20 phút (Tiết mục kết màn)</span>\n    <span class=\"article-meta-badge\">🎯 Kỹ năng: Tinh thần tự hào doanh nghiệp & Khắc sâu thông điệp năm mới</span>\n  </div>\n  <p><strong>Mô tả chi tiết:</strong> Sau khi hoàn thành các chặng thi đấu, mỗi đội nhận được các mảnh ghép bí mật. Toàn bộ doanh nghiệp tập trung lại giữa bờ biển cát trắng, cùng nhau ghép lại thành bức tranh Logo công ty khổng lồ diện tích 50–100m² mang theo Slogan năm mới. Cả tập thể cùng đứng vây quanh hô vang thông điệp chiến thắng dưới góc quay Flycam 4K tuyệt đẹp từ bầu trời Đà Nẵng.</p>\n  <div class=\"article-callout tip\">💡 <strong>Khoảnh Khắc Vàng Media:</strong> Đây là phân đoạn cao trào nhất để sản xuất Video Recap Viral và hình ảnh truyền thông nội bộ, giúp khắc sâu niềm tự hào của từng nhân viên khi được đóng góp một phần vào bức tranh thành công của doanh nghiệp.</div>\n</div>"

                                "type": "paragraph",
                                "text": "### PHÂN TÍCH ĐẶC ĐIỂM THỜI TIẾT 4 MÙA TẠI ĐÀ NẴNG CHO DOANH NGHIỆP\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">01</div>\n    <div class=\"article-step-title\">Tháng 3 Đến Tháng 5: Giai Đoạn Lý Tưởng Số 1 – Nắng Dịu, Biển Êm, Chi Phí Hợp Lý</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">☀️ Nhiệt độ: 25°C – 29°C</span>\n    <span class=\"article-meta-badge\">🌊 Sóng biển: Cấp 1–2, nước trong vắt</span>\n    <span class=\"article-meta-badge\">💰 Mức giá dịch vụ: Tốt nhất mùa thấp điểm</span>\n    <span class=\"article-meta-badge\">⭐ Đánh giá: 10/10 điểm hoàn hảo</span>\n  </div>\n  <p>Đây là khoảng thời gian tuyệt vời nhất trong năm để tổ chức team building biển tại Đà Nẵng. Lúc này miền Trung vừa bước qua mùa mưa, tiết trời trong lành, nắng chan hòa nhưng không oi bức gay gắt. Biển Mỹ Khê và Non Nước sóng phẳng lặng như mặt gương, tạo điều kiện thuận lợi nhất cho các trò chơi vận động nước như chèo SUP, đua thuyền chuối, đường trượt nước khổng lồ.</p>\n  <p><strong>Lợi thế doanh nghiệp:</strong> Vé máy bay đi Đà Nẵng và giá phòng khách sạn/resort giai đoạn này cực kỳ mềm, chưa bước vào mùa cao điểm du lịch hè, giúp doanh nghiệp tiết kiệm 20–30% tổng chi phí chuyến đi.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">02</div>\n    <div class=\"article-step-title\">Tháng 6 Đến Tháng 8: Mùa Hè Rực Lửa – Sôi Động Nhưng Cần Chiến Lược Khung Giờ Vàng</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">☀️ Nhiệt độ: 32°C – 37°C</span>\n    <span class=\"article-meta-badge\">🌊 Sóng biển: Êm đềm, nắng vàng rực rỡ</span>\n    <span class=\"article-meta-badge\">💰 Mức giá dịch vụ: Cao điểm du lịch hè</span>\n    <span class=\"article-meta-badge\">⭐ Đánh giá: 9/10 điểm sôi động</span>\n  </div>\n  <p>Mùa hè là mùa truyền thống cho các chuyến du lịch hè kết hợp Company Trip của các tập đoàn. Không khí biển lúc này vô cùng cuồng nhiệt và náo nhiệt. Tuy nhiên, điểm thách thức lớn nhất là nắng trưa miền Trung rất gay gắt và bức xạ nhiệt cao.</p>\n  <div class=\"article-callout tip\">💡 <strong>Chiến Lược Khung Giờ Vàng Của 2S PRODUCTION:</strong> Chúng tôi khuyến nghị doanh nghiệp chỉ tổ chức vào 2 khung giờ mát mẻ nhất:<br>• <strong>Buổi sáng sớm:</strong> 06:00 – 08:30 (Đón bình minh rực rỡ trên biển Mỹ Khê, không khí mát dịu, ánh sáng vàng ấm cực đẹp để chụp ảnh và quay Flycam).<br>• <strong>Buổi chiều tà:</strong> 15:30 – 18:00 (Nắng đã dịu bớt sau rặng dừa, gió biển thổi mát rượi, sau khi chơi xong có thể tắm biển tự do và chuẩn bị vào tiệc Gala tối).<br>⚠️ <em>Tuyệt đối không tổ chức từ 10:30 đến 14:30 để tránh nguy cơ say nắng và mất nước cho nhân viên.</em></div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">03</div>\n    <div class=\"article-step-title\">Tháng 9 Đến Tháng 11: Mùa Mưa Bão – Cơ Chế Chuyển Đổi 'Plan B' Linh Hoạt Trong 90 Phút</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">🌧️ Nhiệt độ: 23°C – 27°C</span>\n    <span class=\"article-meta-badge\">🌊 Sóng biển: Sóng lớn, có mưa rào rải rác</span>\n    <span class=\"article-meta-badge\">💰 Mức giá dịch vụ: Ưu đãi kích cầu lớn</span>\n    <span class=\"article-meta-badge\">⭐ Đánh giá: Cần đơn vị tổ chức có năng lực dự phòng cao</span>\n  </div>\n  <p>Thời điểm này Đà Nẵng bước vào mùa mưa với những cơn mưa rào bất chợt hoặc gió mùa. Nếu doanh nghiệp dự định tổ chức team building giai đoạn này, điều kiện tiên quyết là phải chọn đơn vị tổ chức có cam kết phương án dự phòng bằng văn bản hợp đồng.</p>\n  <p><strong>Giải pháp 2S PRODUCTION:</strong> Chúng tôi thiết lập kịch bản song hành (Dual Concept). Trong vòng 90 phút trước giờ G, nếu thời tiết biển không an toàn, toàn bộ đạo cụ và âm thanh ánh sáng sẽ lập tức được chuyển đổi sang sảnh Grand Ballroom trong nhà của resort hoặc Nhà thi đấu Tiên Sơn / Quân khu 5 với bộ game trí tuệ Amazing Race Indoor hấp dẫn không kém.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">Tháng 12 Đến Tháng 2: Tiết Trời Se Lạnh – Xu Hướng Team Building Kết Hợp Giải Chạy & Gala YEP</div>\n  </div>\n  <div class=\"article-badge-row\">\n    <span class=\"article-meta-badge\">⛅ Nhiệt độ: 19°C – 24°C</span>\n    <span class=\"article-meta-badge\">🌊 Không khí: Se se lạnh, mát mẻ dễ chịu</span>\n    <span class=\"article-meta-badge\">💰 Mức giá dịch vụ: Cao điểm tiệc tất niên</span>\n    <span class=\"article-meta-badge\">⭐ Đánh giá: 9.5/10 cho các hoạt động thể lực sức bền</span>\n  </div>\n  <p>Không khí se lạnh cuối năm mang hơi thở mùa xuân rất thích hợp cho các hoạt động thể thao sức bền ngoài trời mà không lo mệt mỏi hay đổ mồ hôi nhiều. Rất nhiều doanh nghiệp ưa chuộng hình thức kết hợp Mini Marathon 5km dọc đường Võ Nguyên Giáp, giải đạp xe gắn kết Sơn Trà, sau đó cùng nhau bước vào đêm tiệc Year End Party tổng kết năm cũ.</p>\n</div>"
                        },

                                "type": "paragraph",
                                "text": "### BẢNG TỔNG HỢP SO SÁNH CÁC MÙA TEAM BUILDING TẠI ĐÀ NẴNG\n\n<table class=\"article-table\">\n  <thead>\n    <tr>\n      <th>Giai Đoạn</th>\n      <th>Đặc Điểm Thời Tiết</th>\n      <th>Địa Điểm Khuyến Nghị</th>\n      <th>Loại Hình Trò Chơi</th>\n      <th>Lợi Thế Ngân Sách</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><strong>Tháng 3 – Tháng 5</strong></td>\n      <td>Nắng nhẹ, biển êm, trời xanh ngắt, nhiệt độ 26°C</td>\n      <td>Bãi biển Mỹ Khê, Non Nước, Bãi Rạng Sơn Trà</td>\n      <td>Toàn diện: Game phao hơi, trò chơi nước bãi biển</td>\n      <td>Tối ưu 25% giá phòng & vé máy bay</td>\n    </tr>\n    <tr>\n      <td><strong>Tháng 6 – Tháng 8</strong></td>\n      <td>Nắng hè rực rỡ, nhiệt độ 33–36°C, không mưa</td>\n      <td>Bãi biển các resort ven biển Furama, Hyatt, Pullman</td>\n      <td>Đường trượt nước, bóng lăn khổng lồ, xếp logo</td>\n      <td>Cần đặt cọc dịch vụ trước 2–3 tháng</td>\n    </tr>\n    <tr>\n      <td><strong>Tháng 9 – Tháng 11</strong></td>\n      <td>Mát mẻ, có mưa rào chuyển mùa, biển động</td>\n      <td>Grand Ballroom trong nhà, Nhà thi đấu Tiên Sơn</td>\n      <td>Amazing Race trong nhà, Board game khổng lồ</td>\n      <td>Nhiều chương trình khuyến mãi & quà tặng</td>\n    </tr>\n    <tr>\n      <td><strong>Tháng 12 – Tháng 2</strong></td>\n      <td>Tiết trời se lạnh 20–24°C, không khí tết rộn ràng</td>\n      <td>Bãi biển resort kín gió hoặc sân cỏ resort Hội An</td>\n      <td>Mini Marathon, Trekking Sơn Trà, Combo cùng YEP</td>\n      <td>Tối ưu chi phí truyền thông cuối năm</td>\n    </tr>\n  </tbody>\n</table>\n\n<div class=\"article-callout tip\">💡 <strong>Lời Khuyên Chuyên Gia 2S PRODUCTION:</strong> Nếu doanh nghiệp muốn tổ chức một kỳ Company Trip bãi biển trọn vẹn, nhiều trải nghiệm nước nhất với chi phí tiết kiệm nhất, hãy ưu tiên chọn thời điểm <strong>Tháng 4 hoặc Tháng 5</strong>. Hãy liên hệ với 2S PRODUCTION sớm để giữ vị trí bãi biển đẹp nhất và nhận trọn gói kịch bản độc quyền!</div>"

                                "type": "paragraph",
                                "text": "### BỘ 8 BƯỚC TRIỂN KHAI HỘI THẢO 1 NGÀY CHUẨN NGOẠI GIAO\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">01</div>\n    <div class=\"article-step-title\">Bước 1: Xác Định Mục Tiêu SMART & Vẽ Chân Dung Khách Mời VIP</div>\n  </div>\n  <p>Trước khi bắt tay vào dự toán, doanh nghiệp cần trả lời rõ ràng mục tiêu cốt lõi: Đây là hội thảo nâng cao năng lực nội bộ, ra mắt giải pháp công nghệ mới nhằm thu hút khách hàng tiềm năng B2B, hay là diễn đàn ngoại giao đa quốc gia? Mục tiêu càng rõ ràng thì tiêu chí đo lường hiệu quả (KPI số lượng khách mời, tỷ lệ chuyển đổi hợp đồng) càng chuẩn xác.</p>\n  <div class=\"article-callout tip\">💡 <strong>Quy tắc 2S PRODUCTION:</strong> Phân nhóm khách mời thành 3 hạng: Khách mời Danh dự (Chính khách/Lãnh đạo cấp cao), Khách mời Diễn giả & Báo chí, và Khách mời Đại biểu để thiết lập quy chuẩn lễ tân đón tiếp riêng biệt.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">02</div>\n    <div class=\"article-step-title\">Bước 2: Lập Dự Toán Chi Phí Chi Tiết & Hạch Toán ROI Từng Hạng Mục</div>\n  </div>\n  <p>Một bảng dự toán hội thảo chuyên nghiệp phải bao gồm tối thiểu 6 nhóm hạng mục chính: Thuê địa điểm & phòng họp (Ballroom + Foyer), Dàn dựng sân khấu & Hệ thống thiết bị AV, Ẩm thực (Tea-break 2 cữ + Set Lunch/Buffet trưa), Ấn phẩm truyền thông & Bộ kit quà tặng đại biểu, Thù lao diễn giả & Chi phí lưu trú đi lại, và Chi phí quản lý dự phòng rủi ro 10%.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">03</div>\n    <div class=\"article-step-title\">Bước 3: Khảo Sát & Lựa Chọn Địa Điểm Hội Nghị Đẳng Cấp Tại Đà Nẵng</div>\n  </div>\n  <p>Đà Nẵng sở hữu hệ thống phòng hội nghị chuẩn quốc tế đa dạng. Tùy thuộc vào quy mô:\n• <strong>Hội nghị doanh nghiệp 100–300 khách:</strong> Khách sạn Novotel Danang Premier Han River, Hilton Da Nang, Muong Thanh Luxury, Grand Mercure.\n• <strong>Đại hội quốc tế 300–1000 khách:</strong> Furama Resort & Ariyana Convention Centre (nơi tổ chức APEC 2017), Sheraton Grand Danang, Vinpearl Luxury.</p>\n  <div class=\"article-callout warning\">⚠️ <strong>Lưu ý kỹ thuật:</strong> Khi khảo sát địa điểm, bắt buộc phải đo đạc chiều cao trần hội trường (tối thiểu 4.5m để lắp màn hình LED không bị che khuất tầm nhìn) và kiểm tra công suất điện 3 pha của khách sạn.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">Bước 4: Thiết Kế Agenda Chương Trình & Điều Phối Diễn Giả Chặt Chẽ</div>\n  </div>\n  <p>Thời gian sinh học của người nghe trong hội thảo 1 ngày rất nhạy cảm. 2S PRODUCTION áp dụng công thức vàng: Phiên sáng (08:30 – 11:30) tập trung vào các bài phát biểu định hướng và tham luận chuyên sâu của Keynote Speaker. Phiên chiều (13:45 – 16:30) dành cho Tọa đàm thảo luận bàn tròn (Panel Discussion) và Phiên hỏi đáp mở (Q&A) tương tác cao để giữ cho hội trường luôn tỉnh táo.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">05</div>\n    <div class=\"article-step-title\">Bước 5: Truyền Thông Đa Kênh & Quản Trị Hệ Thống Check-in Tự Động</div>\n  </div>\n  <p>Loại bỏ hoàn toàn quy trình điểm danh bằng sổ tay chậm chạp và dễ gây ùn tắc tại sảnh đón. Chúng tôi triển khai hệ thống quét mã QR Code trên vé điện tử gửi qua Zalo/Email hoặc công nghệ nhận diện khuôn mặt AI FaceID. Khách chỉ cần bước qua cổng nhận diện là tên và đơn vị công tác sẽ tự động hiển thị chào mừng trên màn hình LED sảnh Foyer trong vòng 1 giây.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">06</div>\n    <div class=\"article-step-title\">Bước 6: Setup Hệ Thống Kỹ Thuật AV, Cabin Dịch Thuật & Mạng Riêng Biệt</div>\n  </div>\n  <p>Toàn bộ thiết bị phải được bàn giao và chạy thử nghiệm trước giờ khai mạc tối thiểu 12 tiếng. Hệ thống micro hội nghị cổ ngỗng chống hú Feedback, hệ thống màn hình nhắc chữ cho diễn giả (Comfort Monitor), đường truyền Internet Leased Line 100Mbps độc lập không chia sẻ với khách sạn để đảm bảo tín hiệu Livestream ổn định không giật lag.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">07</div>\n    <div class=\"article-step-title\">Bước 7: Điều Phối Kịch Bản Phút Chót (Show Calling & Timekeeper)</div>\n  </div>\n  <p>Một đạo diễn sân khấu chuyên nghiệp (Show Caller) của 2S PRODUCTION sẽ liên tục điều phối tín hiệu qua tai nghe bộ đàm nội bộ: ra hiệu nhạc chuyển cảnh, điều chỉnh ánh sáng rọi bục phát biểu, chuyển slide thuyết trình và bấm chuông cảnh báo thời gian cho diễn giả để đảm bảo hội thảo kết thúc chính xác theo từng phút.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">08</div>\n    <div class=\"article-step-title\">Bước 8: Khảo Sát Đo Lường Độ Hài Lòng & Chăm Sóc Hậu Sự Kiện</div>\n  </div>\n  <p>Ngay khi phiên bế mạc kết thúc, một mã QR khảo sát trực tuyến sẽ được chiếu lên màn hình để thu thập ý kiến đại biểu. Trong vòng 24 giờ sau hội thảo, toàn bộ tài liệu thuyết trình, hình ảnh kỷ niệm độ phân giải cao và video Highlight của hội thảo sẽ được gửi đến email từng khách mời kèm thư cảm ơn chân thành từ ban tổ chức.</p>\n</div>"

                                "text": "### 2. CHECKLIST HỆ THỐNG ÁNH SÁNG & MÀN HÌNH LED HIỂN THỊ\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">A</div>\n    <div class=\"article-step-title\">Màn Hình LED P2.0 Indoor Siêu Mịn (24m² – 36m²)</div>\n  </div>\n  <p>Đối với hội nghị có slide thuyết trình chứa số liệu biểu đồ tài chính và chữ viết nhỏ, tuyệt đối không sử dụng LED P3.91 ngoài trời để lắp trong nhà vì mật độ điểm ảnh thưa gây vỡ nét. Chuẩn mực hội nghị hiện đại phải là **LED P2.0 Indoor** với độ làm tươi (Refresh Rate) ≥ 3840Hz để khi phóng viên báo chí hoặc khách mời chụp ảnh quay phim màn hình không bị sọc ngang gợn sóng.</p>\n  <div class=\"article-callout tip\">💡 <strong>Giải pháp 2S:</strong> Bố trí thêm 02 màn hình phụ 65-inch (Comfort Monitors) đặt dưới sàn hướng về phía diễn giả để họ dễ dàng theo dõi tiến độ slide thuyết trình mà không cần quay lưng lại nhìn màn hình chính.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">B</div>\n    <div class=\"article-step-title\">Ánh Sáng Đánh Mặt Ấm (Warm White 3200K – 5600K CRI > 95)</div>\n  </div>\n  <p>Ánh sáng hội thảo không dùng chớp nháy loạn xạ. Mục tiêu hàng đầu là làm nổi bật khuôn mặt diễn giả trên bục phát biểu với ánh sáng tự nhiên, tôn màu da chân thực để camera thu hình trực tiếp và chụp ảnh kỷ yếu rõ nét nhất. Hệ thống bao gồm: 08 đèn Fresnel LED 200W, 04 đèn Profile tạo viền sáng bục phát biểu và 08 đèn Par LED nắng ấm phủ đều không gian sân khấu.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">C</div>\n    <div class=\"article-step-title\">Bộ Nguồn Điện Dự Phòng & Bộ Lưu Điện UPS Standby 100%</div>\n  </div>\n  <p>Sự cố mất điện lưới dù hiếm gặp tại các khách sạn 5 sao nhưng vẫn là rủi ro thảm họa. 2S PRODUCTION luôn triển khai một máy phát điện sơ cua công suất 150kVA đặt sẵn ngoài sảnh, kết nối cùng bộ lưu điện UPS công suất lớn cho bàn Mixer âm thanh. Khi mất điện lưới, hệ thống âm thanh vẫn duy trì hoạt động trong 10 phút để người phát ngôn trấn an hội trường trước khi máy phát tự động đóng điện.</p>\n</div>"

                                "text": "### 10 CÂU HỎI QUYẾT ĐỊNH THÀNH BẠI CỦA ĐÊM GALA DINNER\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">01</div>\n    <div class=\"article-step-title\">1. Mục Tiêu Tối Thượng Của Đêm Tiệc Gala Này Là Gì?</div>\n  </div>\n  <p>Bạn muốn một đêm tiệc 'cháy hết mình' gắn kết nhân sự trẻ, một đêm vinh danh trang trọng tri ân nhân viên lâu năm, hay một sự kiện ngoại giao đỉnh cao để ký kết hợp đồng với các đối tác chiến lược? Mỗi mục tiêu sẽ quyết định 100% phong cách thiết kế, thực đơn ẩm thực và thể loại âm nhạc tương ứng.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">02</div>\n    <div class=\"article-step-title\">2. Cơ Cấu Thành Phần Khách Mời Có Đặc Thù Văn Hóa Nào?</div>\n  </div>\n  <p>Độ tuổi trung bình của khách mời là bao nhiêu? Có khách nước ngoài tham dự hay không? Khách có yêu cầu chế độ ăn chay, ăn Halal hay kiêng gluten không? Nắm rõ cơ cấu khách mời giúp ban tổ chức lựa chọn MC song ngữ phù hợp và thực đơn làm hài lòng mọi khẩu vị.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">03</div>\n    <div class=\"article-step-title\">3. Nên Tổ Chức Trong Sảnh Khách Sạn (Indoor) Hay Bãi Biển / Hồ Bơi (Outdoor)?</div>\n  </div>\n  <p>Tiệc ngoài trời ven biển mang lại cảm giác phóng khoáng, lãng mạn và chill tuyệt vời nhưng đòi hỏi chi phí giàn khung rạp che chắn thời tiết. Ngược lại, tiệc trong sảnh Ballroom đảm bảo an toàn 100% về nhiệt độ mát mẻ, âm thanh khép kín không lo mưa gió.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">4. Concept & Key Visual Sự Kiện Đã Đủ Độc Bản Và Mang Đậm Bản Sắc Doanh Nghiệp?</div>\n  </div>\n  <p>Tránh xa các mẫu thiết kế backdrop mẫu có sẵn nhàm chán. Mỗi đêm Gala cần một chủ đề riêng (Theme Concept) như *'Đêm Ánh Sáng Tương Lai', 'Hành Trình Vươn Ra Biển Lớn', 'Dạ Tiệc Gatsby Hoàng Gia'* để tạo dấu ấn sâu đậm trong tâm trí khách tham dự.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">05</div>\n    <div class=\"article-step-title\">5. Ngân Sách Đã Bao Gồm Đầy Đủ Chi Phí Âm Thầm (Hidden Costs) Chưa?</div>\n  </div>\n  <p>Rất nhiều doanh nghiệp bị 'vỡ quỹ' vì quên tính các chi phí phụ của resort: Phí đem rượu từ ngoài vào (Corkage Fee), phí phục vụ phát sinh ngoài giờ (Overtime Fee sau 22:00), phí âm thanh ánh sáng mang ngoài vào resort. Hãy yêu cầu nhà thầu sự kiện liệt kê trọn gói không phát sinh.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">06</div>\n    <div class=\"article-step-title\">6. MC Dẫn Chương Trình Có Đúng Tone Năng Lượng Của Doanh Nghiệp?</div>\n  </div>\n  <p>MC là linh hồn của đêm Gala. Một sự kiện tập đoàn cần MC có phong thái ngoại giao đĩnh đạc, khả năng ứng biến thông minh và xử lý tình huống duyên dáng, chứ không phải một MC chỉ biết đọc thuộc lòng kịch bản.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">07</div>\n    <div class=\"article-step-title\">7. Tiết Mục Đinh (Key Moment) Của Đêm Tiệc Sẽ Diễn Ra Thế Nào?</div>\n  </div>\n  <p>Mỗi đêm Gala cần một khoảnh khắc bùng nổ cảm xúc cao trào: Khắc họa video hành trình chuyển mình của công ty, hiệu ứng đếm ngược Countdown với màn hình LED tương tác 3D, hay màn khui sâm panh kèm pháo hoa kim tuyến rực rỡ.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">08</div>\n    <div class=\"article-step-title\">8. Hình Ảnh & Video Đêm Gala Được Sản Xuất Và Bàn Giao Như Thế Nào?</div>\n  </div>\n  <p>Có tính năng gửi ảnh check-in tự động về điện thoại khách mời trong sự kiện không? Video Highlight có được dựng nhanh trong đêm để kịp truyền thông sáng hôm sau trên fanpage và báo chí không?</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">09</div>\n    <div class=\"article-step-title\">9. Kế Hoạch Dự Phòng (Plan B) Khi Gặp Thời Tiết Xấu Có Cam Kết Ra Sao?</div>\n  </div>\n  <p>Nếu trời mưa lớn hoặc gió giật ven biển, sảnh trong nhà có được khóa dự phòng không? Thời gian chuyển đổi sân khấu mất bao lâu?</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">10</div>\n    <div class=\"article-step-title\">10. Đơn Vị Tổ Chức Có Sở Hữu Thiết Bị Trực Tiếp Hay Phải Thuê Qua Trung Gian?</div>\n  </div>\n  <p>Thuê đơn vị trung gian (sub-agency) thường làm đội giá lên 20–30% và khó kiểm soát chất lượng kỹ thuật. 2S PRODUCTION sở hữu 100% kho thiết bị in-house tại 91 Trần Thanh Mại, Đà Nẵng, cam kết giá gốc tận xưởng và chất lượng chuẩn mực nhất.</p>\n</div>"

                                "type": "paragraph",
                                "text": "### 7 YẾU TỐ PHONG THỦY ĐẠI CÁT TRONG LỄ KHAI TRƯƠNG KHÁNH THÀNH\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">01</div>\n    <div class=\"article-step-title\">Yếu Tố 1: Chọn Ngày Lành Tháng Tốt & Giờ Hoàng Đạo Khai Môn</div>\n  </div>\n  <p>Giờ khai trương phải tương sinh hoặc tương hợp với bản mệnh (Kim, Mộc, Thủy, Hỏa, Thổ) của người đứng đầu doanh nghiệp (Chủ tịch HĐQT hoặc Tổng Giám đốc), tuyệt đối tránh các ngày xung khắc theo can chi, ngày Tam Nương, Nguyệt Kỵ hay Thụ Tử. Khung giờ cắt băng khai trương phải rơi trúng vào thời khắc hoàng đạo để đón nhận luồng sinh khí tốt lành nhất.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">02</div>\n    <div class=\"article-step-title\">Yếu Tố 2: Chuẩn Bị Mâm Lễ Cúng Chu Toàn Đúng Phong Tục Cổ Truyền</div>\n  </div>\n  <p>Mâm cúng khai trương dâng tạ Thần Tài, Thổ Địa và các bậc Tiền Chủ khu đất phải được bài trí trang nghiêm ở vị trí chính diện cửa ra vào hoặc sảnh trung tâm. Bộ lễ vật tiêu chuẩn gồm có: Bộ Tam sên (thịt heo luộc, tôm luộc, trứng vịt luộc), Heo quay nguyên con ngậm hoa tươi màu đỏ biểu trưng cho sự sung túc phồn thịnh, mâm ngũ quả tươi ngon đủ 5 màu tượng trưng cho ngũ hành, hoa đồng tiền, trầu cau, chè xôi gấc đỏ và chén gạo muối tịnh khiết.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">03</div>\n    <div class=\"article-step-title\">Yếu Tố 3: Nghi Thức Múa Lân Sư Rồng 'Khai Quang Điểm Nhãn' Chiêu Tài</div>\n  </div>\n  <p>Lân Sư Rồng là linh vật biểu trưng cho sức mạnh, sự trường tồn và xua đuổi tà khí. Tiết mục quan trọng bậc nhất là nghi thức **'Điểm Nhãn Cho Lân'**: Người đứng đầu doanh nghiệp dùng bút lông chấm mực đỏ son điểm vào trán, hai mắt và mũi lân để đánh thức linh hồn linh vật. Tiếp theo là bài múa *'Song Lân Báo Hỷ'* hoặc *'Lân Leo Cột Hái Lộc'* – thả câu liễn đỏ chúc mừng doanh nghiệp làm ăn phát đạt, tiền tài tấn tới.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">Yếu Tố 4: Nghi Thức Cắt Băng Khánh Thành & Khui Sâm Panh Đắc Lộc</div>\n  </div>\n  <p>Dải lụa đỏ và quả cầu hoa đỏ cắt băng tượng trưng cho sợi dây liên kết may mắn. Số lượng đại biểu tham gia cắt băng thường được chọn theo các con số phong thủy tốt lành như **5 (Ngũ phúc lâm môn), 7 (Thất tinh khởi tài), hoặc 9 (Cửu trùng trường cửu)**. Chiếc kéo cắt băng được mạ vàng sáng bóng và sau khi cắt, tiếng nổ khui sâm panh kèm pháo kim tuyến bung tỏa báo hiệu một tương lai bùng nổ rực rỡ.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">05</div>\n    <div class=\"article-step-title\">Yếu Tố 5: Bố Trí Cổng Chào, Thảm Đỏ Theo Thế 'Thanh Long – Bạch Hổ'</div>\n  </div>\n  <p>Thảm đỏ đón khách phải trải liền mạch từ khu vực vỉa hè bước vào thẳng sảnh chính, dẫn dắt luồng khí thịnh vượng vào bên trong tòa nhà. Vị trí đặt cổng chào hơi, banner chúc mừng và hoa tươi của các đối tác phải tuân thủ nguyên tắc: Bên Tả (Thanh Long - bên trái nhìn từ trong ra) cần bố trí cao hơn bên Hữu (Bạch Hổ - bên phải) để đón nhận sinh khí đắc địa.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">06</div>\n    <div class=\"article-step-title\">Yếu Tố 6: Người 'Mở Hàng' Đầu Tiên (Vía Khai Trương Hợp Mệnh)</div>\n  </div>\n  <p>Vị khách đầu tiên bước vào mua hàng hoặc ký hợp đồng trong ngày khai trương có vai trò cực kỳ quan trọng về mặt tâm linh vía lành. Doanh nghiệp nên chủ động mời trước một vị khách hàng thân thiết, có tính cách xởi lởi, vui vẻ, công việc thành đạt và có thiên can địa chi hợp với gia chủ để 'mở hàng' lấy may mắn.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">07</div>\n    <div class=\"article-step-title\">Yếu Tố 7: Tiệc Nhẹ Tea-Break & Tặng Quà Lưu Niệm Chiêu Phúc</div>\n  </div>\n  <p>Bàn tiệc trà bánh ngọt ngào, trái cây tươi tắn và đồ uống thanh mát thể hiện sự hiếu khách, tạo không khí hân hoan rôm rả. Những món quà nhỏ như sổ tay khắc laser, bút ký mạ vàng hoặc bình giữ nhiệt in logo công ty gửi tặng khách mời ra về mang ý nghĩa trao gửi lộc phúc, giữ vững mối quan hệ gắn bó dài lâu.</p>\n</div>"

ạc Acoustic / Jazz nhẹ nhàng:</strong> 5.000.000đ – 12.000.000đ/set biểu diễn 90 phút.<br>• <strong>Vũ đoàn múa mở màn:</strong> 4.000.000đ – 7.000.000đ (nhóm múa 5–6 vũ công biểu diễn tiết mục Key Moment).</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">Chi Phí Media: Quay Phim 4K, Chụp Ảnh AI FaceID & Video Recap (Chiếm 10–15% Ngân Sách)</div>\n  </div>\n  <p>Nhiếp ảnh gia chuyên nghiệp chụp toàn bộ sự kiện: 2.500.000đ – 4.000.000đ/máy. Dịch vụ chụp ảnh tích hợp công nghệ AI FaceID (quét mặt gửi ảnh về điện thoại trong 5 phút): thêm 2.000.000đ/sự kiện. Quay phim 4K Sony FX3 kết hợp Flycam và dựng Highlight Same-day Edit bàn giao ngay trong đêm tiệc: 6.000.000đ – 12.000.000đ.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">05</div>\n    <div class=\"article-step-title\">Chi Phí Thiết Kế Ấn Phẩm Nhận Diện & Đạo Cụ Khai Tiệc (Chiếm 5–10% Ngân Sách)</div>\n  </div>\n  <p>Bộ Photo booth check-in 3D chụp hình lưu niệm tại sảnh đón (kích thước 3m x 5m bọc fomex nổi khối gắn đèn LED neon): 6.000.000đ – 14.000.000đ. Đạo cụ khui sâm panh, tháp ly ánh sáng, pháo điện tử sân khấu và hộp bốc thăm trúng thưởng may mắn: 2.000.000đ – 4.000.000đ.</p>\n</div>"

                                "text": "### I. LỘ TRÌNH ĐẾM NGƯỢC 4 GIAI ĐOẠN CHUẨN BỊ YEP\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">T9</div>\n    <div class=\"article-step-title\">Giai Đoạn 1 (Tháng 9 – Tháng 10): Khóa Địa Điểm & Chốt Tổng Ngân Sách Dự Toán</div>\n  </div>\n  <p>Đây là thời điểm vàng để khảo sát sảnh tiệc. Các khách sạn và resort lúc này còn nhiều ngày trống cuối tuần (thứ Sáu, thứ Bảy) vào tháng 12 và tháng 1. Doanh nghiệp dễ dàng đàm phán các gói ưu đãi giá phòng, miễn phí phí mang rượu (Corkage) hoặc tặng thêm giờ phục vụ tiệc trà đón khách.</p>\n  <div class=\"article-callout tip\">💡 <strong>Kinh nghiệm 2S:</strong> Luôn đặt cọc giữ sảnh trước tối thiểu 60 đến 75 ngày để bảo vệ quyền lợi về giá và vị trí sảnh đẹp nhất.</div>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">T10</div>\n    <div class=\"article-step-title\">Giai Đoạn 2 (Tháng 10 – Tháng 11): Sáng Tạo Concept Chủ Đề & Thiết Kế Key Visual</div>\n  </div>\n  <p>Lên ý tưởng kịch bản tổng thể (Theme). Một đêm YEP hấp dẫn cần một sợi chỉ đỏ xuyên suốt: Ví dụ *'Vững Bước Tiên Phong – Kiến Tạo Tương Lai', 'Chuyến Bay Hạnh Phúc 2026', 'Dạ Vũ Ánh Sao'*. Từ chủ đề này, đội ngũ thiết kế sẽ phát triển bộ nhận diện đồ họa (Backdrop, Standee, Thiệp mời, Teaser video) đồng bộ để hâm nóng tinh thần toàn công ty.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">T11</div>\n    <div class=\"article-step-title\">Giai Đoạn 3 (Tháng 11): Chốt Nhân Sự Nghệ Thuật, Menu Tiệc & Kịch Bản Chi Tiết</div>\n  </div>\n  <p>Booking MC danh tiếng, ban nhạc, ca sĩ khách mời và vũ đoàn. Thử món (Food Tasting) tại nhà hàng để điều chỉnh khẩu vị món ăn vừa miệng. Đồng thời, phát động phong trào hội diễn văn nghệ nội bộ giữa các phòng ban để tạo không khí thi đua sôi nổi trước thềm đêm tiệc.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">T12</div>\n    <div class=\"article-step-title\">Giai Đoạn 4 (Tháng 12 – Trước Giờ G 7 Ngày): Rehearsal Tổng Duyệt & Khớp Cue Kỹ Thuật</div>\n  </div>\n  <p>Đạo diễn sự kiện của 2S PRODUCTION sẽ tổ chức buổi Rehearsal khớp nối âm thanh, ánh sáng, hình ảnh LED với kịch bản MC và timeline trao thưởng. Chuẩn bị chu đáo kỷ niệm chương, quà tri ân mạ vàng và phong bao bốc thăm trúng thưởng để không xảy ra bất kỳ sai sót nào trong đêm tiệc chính thức.</p>\n</div>"

cle-step-title\">Bộ Quà Tặng Tri Ân Độc Bản Mang Hơi Thở Di Sản Đà Nẵng – Hội An</div>\n  </div>\n  <p>Món quà chia tay ra về là điểm chạm cảm xúc cuối cùng. 2S PRODUCTION hỗ trợ doanh nghiệp thiết kế những hộp quà quà tặng cao cấp: Trà hoa cúc cung đình, trầm hương thượng hạng Quảng Nam, hoặc các sản phẩm lụa tơ tằm Hội An được đóng hộp nhung sang trọng in chìm logo doanh nghiệp mạ vàng.</p>\n</div>"

                                "text": "### I. 4 ĐIỂM NHẤN ĐẶC SẮC TRONG LỄ HỘI TẾT DOANH NGHIỆP CỦA 2S PRODUCTION\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">01</div>\n    <div class=\"article-step-title\">Không Gian Chợ Quê Ngày Tết 'Ký Ức Mùa Xuân'</div>\n  </div>\n  <p>Khu vực đón khách được tái hiện thành một góc phố Tết xưa với mái tranh, chõng tre, cây nêu đón tết và cành mai vàng, đào thắm. Khách mời được xin chữ ông đồ viết thư pháp chúc phúc trên giấy điệp đỏ ('Tấn Tài Tấn Lộc', 'Bình An', 'Thuận Buồm Xuôi Gió'), thưởng thức trà cung đình và mứt gừng ấm nồng.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">02</div>\n    <div class=\"article-step-title\">Trò Chơi Dân Gian Đập Niêu Rinh Lộc & Bịt Mắt Bắt Vịt</div>\n  </div>\n  <p>Giải tỏa toàn bộ áp lực căng thẳng sau một năm làm việc vất vả với các trò chơi dân gian tương tác vui nhộn: Đập niêu đất nhận phong bao lì xì, thắt lá dừa nghệ thuật, nhảy sạp ngày xuân và ném còn may mắn. Tiếng hò reo cổ vũ náo nhiệt sẽ phá vỡ mọi rào cản phòng ban.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">03</div>\n    <div class=\"article-step-title\">Kịch Bản Sân Khấu 'Táo Quân Doanh Nghiệp – Gặp Nhau Cuối Năm'</div>\n  </div>\n  <p>Tiết mục đinh độc quyền được đội ngũ biên kịch 2S PRODUCTION 'đo ni đóng giày' cho từng khách hàng. Các Táo Kinh Doanh, Táo Marketing, Táo Nhân Sự lần lượt báo cáo các chỉ số KPI, những câu chuyện 'dở khóc dở cười' nơi công sở bằng tiếng cười trào phúng, nhân văn và tràn ngập niềm tin hướng về năm mới thắng lợi.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">04</div>\n    <div class=\"article-step-title\">Nghi Thức Khai Xuân Đắc Lộc & Trao Phong Bao May Mắn Đầu Năm</div>\n  </div>\n  <p>Màn trình diễn Múa Lân Sư Rồng mừng xuân rộn rã trống chiêng xông đất hội trường. Ban Lãnh đạo trực tiếp trao tận tay từng phong bao lì xì đỏ may mắn cho toàn thể cán bộ nhân viên, gửi gắm lời chúc một năm mới mã đáo thành công, an khang thịnh vượng và cùng nhau chinh phục những đỉnh cao mới.</p>\n</div>"
                        },
                        {
                                "type": "paragraph",
                                "text": "### II. Ý NGHĨA KẾT NỐI VĂN HÓA & KHÍ THẾ TÂN NIÊN DOANH NGHIỆP\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">🧧</div>\n    <div class=\"article-step-title\">Nghi Lễ Tôn Vinh & Tri Ân Gia Đình Cán Bộ Nhân Viên</div>\n  </div>\n  <p>Tết là sum vầy. Việc mời bố mẹ, vợ chồng và con cái của cán bộ nhân viên cùng tham dự tiệc Tết doanh nghiệp là minh chứng cho sự quan tâm nhân văn sâu sắc của ban lãnh đạo. Lòng biết ơn đối với hậu phương vững chắc sẽ củng cố niềm tin và sự tận tụy cống hiến lâu dài của nhân viên.</p>\n</div>\n\n<div class=\"article-section-card\">\n  <div class=\"article-step-header\">\n    <div class=\"article-step-num\">🚀</div>\n    <div class=\"article-step-title\">Lễ Phát Động Kế Hoạch Năm Mới – Khí Thế Tiên Phong 2026</div>\n  </div>\n  <p>Sau những giờ phút hoài niệm năm cũ, thời khắc đếm ngược đón mừng năm mới là lúc toàn thể ban lãnh đạo và các trưởng phòng ban cùng ký tên lên 'Bức Tranh Cam Kết Mục Tiêu Doanh Số'. Tiếng reo hò quyết tâm và ly rượu vang mừng xuân sẽ thắp lên ngọn lửa nhiệt huyết cho một năm mới đại thắng lợi.</p>\n</div>"
                        }

    async function processUploadedImageFile(file) {
      if (location.protocol.startsWith('http') && cms.settings.cfUseCloudflare) {
        try {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch(cms.settings.cfUploadEndpoint || '/api/upload', {
            method: 'POST',
            body: fd
          });
          if (res.ok) {
            const json = await res.json();
            if (json && json.url) return json.url;
          }
        } catch (err) {}
      }

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1400;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.84));
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function detectInitialPageFromUrl() {
      const path = (window.location.pathname || '').toLowerCase();
      const fullHash = (window.location.hash || '').replace(/^#\/?/, '');
      const hash = fullHash.split('?')[0].toLowerCase();
      const search = (window.location.search || '').toLowerCase();

      if (fullHash.includes('?')) {
        const params = new URLSearchParams(fullHash.split('?')[1]);
        if (params.get('id')) {
          initialActiveId = params.get('id');
        }
      }

      if (path.includes('admin') || hash === 'admin' || search.includes('admin')) {
        return 'admin';
      }
      if (hash === 'about' || path.endsWith('/about')) return 'about';
      if (hash === 'services' || path.endsWith('/services')) return 'services';
      if (hash === 'service-detail') return 'service-detail';
      if (hash === 'work' || path.endsWith('/work')) return 'work';
      if (hash === 'work-detail') return 'work-detail';
      if (hash === 'news' || path.endsWith('/news')) return 'news';
      if (hash === 'news-detail' || path.endsWith('/news-detail')) return 'news-detail';
      if (hash === 'contact' || path.endsWith('/contact')) return 'contact';
      return 'home';
    }

      state.pendingUploadCallback = null;

      const urls = [];

    // TRÌNH XỬ LÝ & KÉO THẢ CÁC KHỐI CMS NỘI DUNG TRỰC QUAN (VISUAL BLOCK BUILDER - CANVA STYLE)
    function parseHtmlCard(cardHtml) {
      const numMatch = cardHtml.match(/class="article-step-num">([^<]+)<\/div>/);
      const titleMatch = cardHtml.match(/class="article-step-title">([^<]+)<\/div>/);
      
      const badges = [];
      const badgeRegex = /class="article-meta-badge">([^<]+)<\/span>/g;
      let bMatch;
      while ((bMatch = badgeRegex.exec(cardHtml)) !== null) {
        badges.push(bMatch[1].trim());
      }
      
      let tip = '';
      const tipMatch = cardHtml.match(/class="article-callout[^"]*">([\s\S]+?)<\/div>/);
      if (tipMatch) {
        tip = tipMatch[1].replace(/<[^>]+>/g, '').replace(/^[💡⚠️💎❝]\s*/, '').replace(/^(?:Quy tắc|Lưu ý|Mẹo|Báo giá)[^:]*:\s*/i, '').trim();
      }
      
      let pText = '';
      const pMatches = [...cardHtml.matchAll(/<p>([\s\S]+?)<\/p>/g)];
      if (pMatches.length) {
        pText = pMatches.map(m => m[1].replace(/<[^>]+>/g, '').trim()).join('\n\n');
      } else {
        pText = cardHtml
          .replace(/<div class="article-step-header">[\s\S]+?<\/div>\s*<\/div>/, '')
          .replace(/<div class="article-badge-row">[\s\S]+?<\/div>/, '')
          .replace(/<div class="article-callout[^"]*">[\s\S]+?<\/div>/, '')
          .replace(/<[^>]+>/g, '')
          .trim();
      }
      
      return {
        type: 'step',
        stepNum: numMatch ? numMatch[1].trim() : '',
        title: titleMatch ? titleMatch[1].trim() : 'Mục nội dung',
        text: pText,
        tip: tip,
        badges: badges.length ? badges : undefined,
        style: 'gold'
      };
    }

    function parseHtmlTable(tableHtml, preTitle) {
      const headers = [];
      const thRegex = /<th[^>]*>([\s\S]+?)<\/th>/g;
      let thMatch;
      while ((thMatch = thRegex.exec(tableHtml)) !== null) {
        headers.push(thMatch[1].replace(/<[^>]+>/g, '').trim());
      }
      
      const rows = [];
      const trRegex = /<tr[^>]*>([\s\S]+?)<\/tr>/g;
      let trMatch;
      while ((trMatch = trRegex.exec(tableHtml)) !== null) {
        const rowContent = trMatch[1];
        if (rowContent.includes('<th')) continue;
        const cells = [];
        const tdRegex = /<td[^>]*>([\s\S]+?)<\/td>/g;
        let tdMatch;
        while ((tdMatch = tdRegex.exec(rowContent)) !== null) {
          cells.push(tdMatch[1].replace(/<[^>]+>/g, '').trim());
        }
        if (cells.length) rows.push(cells);
      }
      
      return {
        type: 'table',
        title: preTitle || 'Bảng So Sánh & Thông Số',
        headers: headers.length ? headers : ['Cột 1', 'Cột 2', 'Cột 3'],
        rows: rows.length ? rows : [['Giá trị 1', 'Giá trị 2', 'Giá trị 3']],
        style: 'striped'
      };
    }

    function normalizeBlocks(blocks) {
      if (!Array.isArray(blocks)) return [];
      const result = [];

      blocks.forEach(b => {
        if (!b) return;
        if ((b.type !== 'text' && b.type !== 'paragraph') || !b.text) {
          result.push(b);
          return;
        }

        const text = b.text;
        const hasCard = text.includes('article-section-card');
        const hasTable = text.includes('<table');

        if (!hasCard && !hasTable) {
          if (text.startsWith('### ')) {
            result.push({
              type: 'heading',
              level: 3,
              text: text.replace(/^###\s*/, '').trim()
            });
          } else {
            result.push(b);
          }
          return;
        }

        if (hasCard) {
          const parts = text.split(/<div class="article-section-card">/);
          if (parts[0].trim()) {
            const lead = parts[0].trim();
            if (lead.startsWith('### ')) {
              result.push({
                type: 'heading',
                level: 3,
                text: lead.replace(/^###\s*/, '').trim()
              });
            } else {
              result.push({
                type: 'paragraph',
                text: lead
              });
            }
          }
          for (let i = 1; i < parts.length; i++) {
            result.push(parseHtmlCard(parts[i]));
          }
          return;
        }

        if (hasTable) {
          const titleMatch = text.match(/###\s*([^\n<]+)/);
          const preTitle = titleMatch ? titleMatch[1].trim() : '';
          result.push(parseHtmlTable(text, preTitle));
          return;
        }
      });

      return result;
    }

    function normalizeAllCmsBlocks() {
      if (typeof cms === 'undefined') return;
      ['articles', 'services', 'works'].forEach(key => {
        (cms[key] || []).forEach(item => {

                    </div>
                    ${b.badges && b.badges.length ? `
                      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
                        ${b.badges.map(bg => `<span style="background:rgba(214,183,121,0.15);border:1px solid rgba(140,107,40,0.25);color:#8C6B28;font-size:0.75rem;font-weight:700;padding:3px 10px;border-radius:9999px">${bg}</span>`).join('')}
                      </div>
                    ` : ''}
                    <div class="article-editorial-content" style="color:#243752;font-size:1.02rem;line-height:1.85;margin:0">
                      ${(b.text || '').split(/\n\n+/).map(p => {
                        const trimmed = p.trim();
                        if (!trimmed) return '';
                        return `<p style="margin:0 0 10px">${trimmed.replace(/\n/g, '<br/>')}</p>`;
                      }).join('')}
                    </div>
                    ${b.tip ? `
                      <div style="background:rgba(214,183,121,0.14);border:1px solid rgba(140,107,40,0.22);border-radius:6px;padding:12px 18px;margin-top:14px;display:flex;align-items:flex-start;gap:10px;font-size:0.92rem;line-height:1.65;color:#1E293B">
                        <span style="font-size:1.15rem;line-height:1">💡</span>
                        <div><strong style="color:#8C6B28">Mẹo 2S PRODUCTION:</strong> ${b.tip}</div>
                      </div>
                    ` : ''}
                  </div>
                `;
              }
              if (b.type === 'table') {
                return `
                  <div class="canva-table-container" style="margin:28px 0;overflow-x:auto">
                    ${b.title ? `<h3 style="font-size:clamp(1.05rem,1.8vw,1.25rem);font-weight:800;color:var(--text-deep-ink);font-family:'Plus Jakarta Sans','Be Vietnam Pro',sans-serif;margin:0 0 14px;display:flex;align-items:center;gap:8px"><span style="color:#8C6B28">▤</span> ${b.title}</h3>` : ''}
                    <table class="article-table" style="width:100%;border-collapse:separate;border-spacing:0;background:rgba(231,233,237,0.72);border-radius:8px;overflow:hidden;border:1px solid rgba(23,35,52,0.12);box-shadow:0 4px 14px rgba(16,30,54,0.04)">
                      <thead>
                        <tr style="background:#0E1722;color:#FFFFFF">
                          ${(b.headers || []).map(h => `<th style="padding:14px 18px;text-align:left;font-size:0.85rem;font-weight:800;letter-spacing:0.5px;color:#D6B779;border-bottom:2px solid #8C6B28;white-space:nowrap">${h}</th>`).join('')}
                        </tr>
                      </thead>
                      <tbody>
                        ${(b.rows || []).map((row, rIdx) => `
                          <tr style="background:${rIdx % 2 === 0 ? 'rgba(255,255,255,0.45)' : 'rgba(231,233,237,0.3)'};border-bottom:1px solid rgba(23,35,52,0.08);transition:background 0.2s">
                            ${row.map((cell, cIdx) => `<td style="padding:13px 18px;font-size:0.92rem;color:#243752;line-height:1.65;border-bottom:1px solid rgba(23,35,52,0.08);${cIdx === 0 ? 'font-weight:700;color:var(--text-deep-ink);white-space:nowrap' : ''}">${cell}</td>`).join('')}
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                `;
              }
              if (b.type === 'text' || b.type === 'paragraph') {
                const fontStyle = b.fontStyle === 'italic' ? 'font-style:italic;' : '';
                const color = b.color || '#243752';
                const fontSize = b.fontSize || '1.02rem';
                let formatted = (b.text || '')
                  .replace(/###\s+(.+)/g, "<h3 style=\"color:var(--text-deep-ink);font-family:'Plus Jakarta Sans','Be Vietnam Pro',sans-serif;font-size:1.22rem;font-weight:800;margin:30px 0 14px;line-height:1.4\">$1</h3>")
                  .replace(/####\s+(.+)/g, "<h4 style=\"color:#8C6B28;font-family:'Plus Jakarta Sans','Be Vietnam Pro',sans-serif;font-size:1.05rem;font-weight:700;margin:22px 0 12px;line-height:1.4\">$1</h4>")
                  .replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text-deep-ink)">$1</strong>');

                if (/<(div|table|ul|ol|h[1-6]|section)/i.test(formatted)) {
                  return `<div class="article-editorial-content" style="color:${color};font-size:${fontSize};${fontStyle}margin-bottom:18px">${formatted}</div>`;
                }

                const paragraphs = formatted.split(/\n\n+/).map(p => {
                  const trimmed = p.trim();
                  if (!trimmed) return '';
                  return `<p style="margin:0 0 18px;line-height:1.85;color:${color}">${trimmed.replace(/\n/g, '<br/>')}</p>`;
                }).join('');
                return `<div class="article-editorial-content" style="font-size:${fontSize};${fontStyle}">${paragraphs}</div>`;
              }
              if (b.type === 'image') {
                return `
                  <figure style="margin:28px 0;text-align:center">
                    <div style="position:relative;border-radius:6px;overflow:hidden;box-shadow:0 6px 20px rgba(16,30,54,0.08);background:#0E1722">
                      <img src="${b.url}" alt="${b.caption || ''}" class="lazy-img" style="width:100%;max-height:560px;object-fit:cover;display:block" loading="lazy" />
                      <div class="bento-zoom-badge" data-action="open-photo-direct" data-url="${b.url}" data-title="${b.caption || ''}">⤢</div>
                    </div>
                    ${b.caption ? `<figcaption style="font-size:0.82rem;color:#64748B;margin-top:10px;font-style:italic">📷 ${b.caption}</figcaption>` : ''}
                  </figure>
                `;
              }
              if (b.type === 'gallery') {
                const imgs = b.images || [];
                return `
                  <div style="margin:28px 0">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
                      ${imgs.map(u => `
                        <div style="position:relative;height:190px;border-radius:6px;overflow:hidden;box-shadow:0 4px 14px rgba(16,30,54,0.08);background:#0E1722">
                          <img src="${u}" style="width:100%;height:100%;object-fit:cover" class="lazy-img" loading="lazy" />
                          <div class="bento-zoom-badge" data-action="open-photo-direct" data-url="${u}" data-title="${b.caption || ''}">⤢</div>
                        </div>
                      `).join('')}
                    </div>
                    ${b.caption ? `<div style="font-size:0.82rem;color:#64748B;margin-top:10px;text-align:center;font-style:italic">📷 ${b.caption}</div>` : ''}
                  </div>
                `;
              }
              if (b.type === 'callout') {
                const icon = b.calloutType === 'warning' ? '⚠️' : b.calloutType === 'price' ? '💎' : b.calloutType === 'quote' ? '❝' : '💡';
                return `
                  <div class="article-callout tip" style="margin:22px 0;background:rgba(214,183,121,0.12);border:1px solid rgba(23,35,52,0.08);border-left:4px solid #8C6B28;padding:18px 24px;border-radius:0 6px 6px 0">
                    <strong style="color:var(--text-deep-ink);font-size:0.95rem;display:flex;align-items:center;gap:8px;margin-bottom:6px">
                      <span>${icon}</span>
                      <span style="color:#8C6B28">${b.title || 'Lưu Ý Quan Trọng Từ 2S PRODUCTION:'}</span>
                    </strong>
                    <p style="color:#243752;font-size:0.92rem;margin:0;line-height:1.7">${b.text || ''}</p>
                  </div>
                `;
              }
              if (b.type === 'checklist') {
                const items = b.items || [];
                return `
                  <div style="margin:24px 0;background:rgba(23,35,52,0.03);border:1px solid rgba(23,35,52,0.08);padding:22px 26px;border-radius:6px">
                    ${b.title ? `<h4 style="font-size:1.05rem;font-weight:700;margin:0 0 16px;color:var(--text-deep-ink)">${b.title}</h4>` : ''}
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
                      ${items.map(it => `
                        <div style="display:flex;align-items:flex-start;gap:8px;font-size:0.9rem;color:#243752">
                          <span style="color:#8C6B28;font-weight:800">✔</span>
                          <span>${it}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }
              return '';
            }).join('')}
          </div>
        `;
      }

      // 2. CHẾ ĐỘ QUẢN TRỊ ADMIN: TRÌNH SOẠN THẢO VISUAL CANVA-STYLE (KHÔNG CODE HTML, KÉO THẢ, CHỌN STYLE, BẢNG TRỰC QUAN)
      return `
        <div class="cms-block-builder-wrapper" style="margin:24px 0">
          <!-- THANH DOCK CANVA VISUAL BUILDER Ở ĐẦU TRANG -->
          <div class="canva-editor-dock">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;border-bottom:1px solid rgba(214,183,121,0.25);padding-bottom:12px">
              <div style="display:flex;align-items:center;gap:10px">
                <span style="background:linear-gradient(135deg,#D6B779,#8C6B28);color:#0E1722;padding:4px 10px;border-radius:5px;font-size:0.75rem;font-weight:900;letter-spacing:1px">CANVA CMS BUILDER</span>
                <span style="color:#FFFFFF;font-size:0.95rem;font-weight:700">Kéo Thả Khối & Chọn Style Trực Quan (Không Cần Code HTML)</span>
              </div>
              <div style="display:flex;gap:8px;align-items:center">
                <span style="color:#10B981;font-size:0.75rem;font-weight:700;background:rgba(16,185,129,0.15);padding:4px 10px;border-radius:4px;border:1px solid rgba(16,185,129,0.3)">
                  ✔ Tự động lưu mọi thay đổi
                </span>
              </div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              <span style="font-size:0.75rem;color:#D6B779;font-weight:800;text-transform:uppercase;margin-right:4px">Chèn Khối Mới:</span>
              <button type="button" class="btn-canva-tool" data-action="add-block-step" data-type="${type}" data-id="${item.id}">
                <span style="color:#D6B779">✦</span> Thẻ Bước / Quy Trình
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-table" data-type="${type}" data-id="${item.id}">
                <span style="color:#D6B779">▤</span> Bảng So Sánh
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-heading" data-type="${type}" data-id="${item.id}">
                <span style="color:#D6B779">Aa</span> Tiêu Đề
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-text" data-type="${type}" data-id="${item.id}">
                <span style="color:#D6B779">¶</span> Đoạn Văn
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-image" data-type="${type}" data-id="${item.id}">
                <span>🖼️</span> Tải Ảnh
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-gallery" data-type="${type}" data-id="${item.id}">
                <span>▦</span> Bộ Sưu Tập Ảnh
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-callout" data-type="${type}" data-id="${item.id}">
                <span>💡</span> Hộp Điểm Nhấn
              </button>
              <button type="button" class="btn-canva-tool" data-action="add-block-checklist" data-type="${type}" data-id="${item.id}">
                <span>☑</span> Checklist
              </button>
            </div>
          </div>

          <!-- DANH SÁCH CÁC KHỐI NỘI DUNG VỚI ĐƯỜNG KẺ CHÈN XEN KẼ (CANVA DIVIDERS) VÀ KÉO THẢ SẮP XẾP -->
          <div class="cms-blocks-container" id="cmsBlocksContainer" data-type="${type}" data-id="${item.id}">
            ${blocks.map((b, idx) => `
              <!-- ĐƯỜNG KẺ CHÈN KHỐI TẠI VỊ TRÍ NÀY -->
              <div class="canva-insert-divider">
                <div class="canva-insert-pill-group">
                  <span class="canva-insert-label">＋ Chèn tại #${idx + 1}:</span>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="step" data-type="${type}" data-id="${item.id}" data-idx="${idx}">✦ Bước</button>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="table" data-type="${type}" data-id="${item.id}" data-idx="${idx}">▤ Bảng</button>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="heading" data-type="${type}" data-id="${item.id}" data-idx="${idx}">Aa Tiêu đề</button>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="text" data-type="${type}" data-id="${item.id}" data-idx="${idx}">¶ Đoạn văn</button>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="image" data-type="${type}" data-id="${item.id}" data-idx="${idx}">🖼️ Ảnh</button>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="callout" data-type="${type}" data-id="${item.id}" data-idx="${idx}">💡 Điểm nhấn</button>
                  <button type="button" class="btn-canva-mini" data-action="insert-block" data-insert-type="checklist" data-type="${type}" data-id="${item.id}" data-idx="${idx}">☑ Checklist</button>
                </div>
              </div>

              <!-- THẺ KHỐI NỘI DUNG (DRAGGABLE) -->
              <div
                class="cms-block-card block-item-box"
                draggable="true"
                data-block-idx="${idx}"
                data-type="${type}"
                data-id="${item.id}"
                style="border-radius:8px;border:1px solid rgba(23,35,52,0.18);margin-bottom:18px;position:relative;background:#FFFFFF;box-shadow:0 4px 14px rgba(16,30,54,0.06);transition:all 0.2s ease"
              >
                <!-- THANH ĐIỀU HƯỚNG CỦA KHỐI (DRAG HANDLE + ACTIONS) -->
                <div class="block-item-toolbar" style="background:#F4F6F9;padding:10px 14px;border-bottom:1px solid rgba(23,35,52,0.1);border-radius:7px 7px 0 0;display:flex;justify-content:space-between;align-items:center">
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="block-drag-handle" style="cursor:grab;font-size:1.1rem;color:#8C6B28;user-select:none" title="Giữ chuột và kéo để đổi vị trí khối">⋮⋮</span>
                    <span style="background:#0E1722;color:#D6B779;padding:2px 8px;border-radius:4px;font-size:0.7rem;font-weight:800">
                      #${idx + 1} • ${
                        b.type === 'step' ? 'THẺ BƯỚC / QUY TRÌNH (STEP CARD)' :
                        b.type === 'table' ? 'BẢNG SO SÁNH / THÔNG SỐ (TABLE)' :
                        b.type === 'heading' ? 'TIÊU ĐỀ (HEADING)' :
                        (b.type === 'text' || b.type === 'paragraph') ? 'ĐOẠN VĂN (PARAGRAPH)' :
                        b.type === 'image' ? 'HÌNH ẢNH (SINGLE IMAGE)' :
                        b.type === 'gallery' ? 'BỘ SƯU TẬP (GALLERY)' :
                        b.type === 'callout' ? 'HỘP ĐIỂM NHẤN (CALLOUT)' :
                        b.type === 'checklist' ? 'DANH SÁCH (CHECKLIST)' : 'KHỐI TÙY CHỈNH'
                      }
                    </span>
                  </div>
                  <div style="display:flex;gap:4px;align-items:center">
                    <button type="button" class="block-ctrl-btn" data-action="block-up" data-type="${type}" data-id="${item.id}" data-idx="${idx}" title="Đẩy lên trên">↑ Lên</button>
                    <button type="button" class="block-ctrl-btn" data-action="block-down" data-type="${type}" data-id="${item.id}" data-idx="${idx}" title="Đẩy xuống dưới">↓ Xuống</button>
                    <button type="button" class="block-ctrl-btn" style="color:#e11d48;border-color:#fda4af" data-action="block-delete" data-type="${type}" data-id="${item.id}" data-idx="${idx}" title="Xóa khối này">✕ Xóa</button>
                  </div>
                </div>

                <!-- NỘI DUNG CHỈNH SỬA CỦA TỪNG LOẠI KHỐI (CANVA-STYLE VISUAL EDITORS) -->
                <div style="padding:16px">
                  ${b.type === 'step' ? `
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#F8FAFC;padding:8px 12px;border-radius:6px;border:1px solid #E2E8F0">
                      <span style="font-size:0.75rem;font-weight:700;color:#64748B">Giao diện thẻ:</span>
                      <select class="admin-input" style="padding:4px 8px;font-size:0.8rem;background:#FFFFFF;max-width:200px" data-block-style="style" data-type="${type}" data-id="${item.id}" data-idx="${idx}">
                        <option value="gold" ${(!b.style || b.style === 'gold') ? 'selected' : ''}>✦ Vàng Gold Hoàng Gia</option>
                        <option value="glass" ${b.style === 'glass' ? 'selected' : ''}>✦ Kính Trong Mờ Glass</option>
                        <option value="minimal" ${b.style === 'minimal' ? 'selected' : ''}>✦ Tối Giản Hiện Đại</option>
                      </select>
                      <span style="font-size:0.75rem;color:#64748B;margin-left:auto">💡 Văn bản thuần túy, không cần gõ HTML</span>
                    </div>
                    <div style="display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;margin-bottom:10px">
                      <input type="text" class="admin-input" style="text-align:center;font-weight:800;font-size:1.1rem;background:#0E1722;color:#D6B779" value="${b.stepNum || ''}" placeholder="01" data-block-input="stepNum" data-type="${type}" data-id="${item.id}" data-idx="${idx}" title="Số thứ tự bước" />
                      <input type="text" class="admin-input" style="font-size:1.05rem;font-weight:700;color:var(--text-deep-ink);background:#FFFFFF" value="${b.title || ''}" placeholder="Nhập tiêu đề bước (vd: Bước 1: Khảo sát địa điểm)..." data-block-input="title" data-type="${type}" data-id="${item.id}" data-idx="${idx}" />
                    </div>
                    <div style="margin-bottom:10px">
                      <label style="display:block;font-size:0.75rem;font-weight:700;color:#64748B;margin-bottom:4px">Nội dung hướng dẫn chi tiết:</label>
                      <textarea rows="3" class="admin-textarea" style="font-size:0.92rem;line-height:1.6;color:#1E293B;background:#FFFFFF;border:1px solid rgba(23,35,52,0.18)" placeholder="Nhập nội dung mô tả của bước này..." data-block-input="text" data-type="${type}" data-id="${item.id}" data-idx="${idx}">${b.text || ''}</textarea>
                    </div>
                    <div>
                      <label style="display:block;font-size:0.75rem;font-weight:700;color:#8C6B28;margin-bottom:4px">💡 Mẹo hoặc lưu ý thực tế từ chuyên gia (Tùy chọn):</label>
                      <input type="text" class="admin-input" style="font-size:0.85rem;background:#FFFBF0;border:1px solid rgba(140,107,40,0.3);color:#1E293B" value="${b.tip || ''}" placeholder="Nhập mẹo hoặc lưu ý thực tế..." data-block-input="tip" data-type="${type}" data-id="${item.id}" data-idx="${idx}" />
                    </div>
                  ` : ''}

                  ${b.type === 'table' ? `
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#F8FAFC;padding:8px 12px;border-radius:6px;border:1px solid #E2E8F0">
                      <span style="font-size:0.75rem;font-weight:700;color:#64748B">Kiểu bảng:</span>
                      <select class="admin-input" style="padding:4px 8px;font-size:0.8rem;background:#FFFFFF;max-width:200px" data-block-style="style" data-type="${type}" data-id="${item.id}" data-idx="${idx}">
                        <option value="striped" ${(!b.style || b.style === 'striped') ? 'selected' : ''}>▤ Sọc Kẻ Hiện Đại (Striped)</option>
                        <option value="glass" ${b.style === 'glass' ? 'selected' : ''}>▤ Kính Mờ Sang Trọng (Glass)</option>
                      </select>
                      <span style="font-size:0.75rem;color:#64748B;margin-left:auto">💡 Chỉnh sửa ô trực tiếp, không cần code HTML</span>
                    </div>
                    <div style="margin-bottom:12px">
                      <label style="display:block;font-size:0.75rem;font-weight:700;color:#64748B;margin-bottom:4px">Tiêu đề bảng:</label>
                      <input type="text" class="admin-input" style="font-size:1rem;font-weight:700;color:var(--text-deep-ink);background:#FFFFFF" value="${b.title || ''}" placeholder="Nhập tiêu đề bảng (vd: BẢNG SO SÁNH 4 MÙA TỔ CHỨC)..." data-block-input="title" data-type="${type}" data-id="${item.id}" data-idx="${idx}" />
                    </div>
                    <div class="canva-table-editor-wrapper" style="overflow-x:auto;margin-bottom:12px;border:1px solid #CBD5E1;border-radius:6px">
                      <table style="width:100%;border-collapse:collapse;min-width:540px">
                        <thead>
                          <tr style="background:#0F172A">
                            ${(b.headers || []).map((h, cIdx) => `
                              <th style="padding:8px;border:1px solid #334155;color:#D6B779">
                                <input type="text" class="admin-input" style="font-size:0.8rem;font-weight:700;color:#D6B779;background:#1E293B;padding:4px 8px;border-color:#475569" value="${h}" placeholder="Tên cột ${cIdx + 1}" data-table-header="${cIdx}" data-type="${type}" data-id="${item.id}" data-idx="${idx}" />
                              </th>
                            `).join('')}
                            <th style="width:50px;padding:8px;border:1px solid #334155;color:#94A3B8;text-align:center;font-size:0.75rem">Xóa</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${(b.rows || []).map((row, rIdx) => `
                            <tr style="background:${rIdx % 2 === 0 ? '#FFFFFF' : '#F8FAFC'}">
                              ${row.map((cell, cIdx) => `
                                <td style="padding:6px 8px;border:1px solid #E2E8F0">
                                  <input type="text" class="admin-input" style="font-size:0.85rem;padding:4px 8px;background:#FFFFFF;border-color:#CBD5E1;color:#1E293B;width:100%" value="${cell}" placeholder="Nội dung ô..." data-table-cell="1" data-ridx="${rIdx}" data-cidx="${cIdx}" data-type="${type}" data-id="${item.id}" data-idx="${idx}" />
                                </td>
                              `).join('')}
                              <td style="padding:6px;border:1px solid #E2E8F0;text-align:center">

    let revealObserver = null;
    function initScrollRevealAndLazyImages() {
      syncAmbientBackgroundDOM();

      document.querySelectorAll('img.lazy-img').forEach(img => {
        const markLoaded = () => img.classList.add('loaded');
        if (img.complete && img.naturalWidth > 0) {
          markLoaded();
        } else {
          img.addEventListener('load', markLoaded, { once: true });
          img.addEventListener('error', markLoaded, { once: true });
        }
      });

      document.querySelectorAll('[data-hover-bg]').forEach(card => {
        card.addEventListener('mouseenter', () => {
          const url = card.getAttribute('data-hover-bg');
          if (url) syncAmbientBackgroundDOM(url);
        });
      });

      if (revealObserver) {
        revealObserver.disconnect();
      }
      if ('IntersectionObserver' in window) {
        revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');

              const counters = entry.target.querySelectorAll('[data-count-target]');
              counters.forEach(counter => {
                if (counter.dataset.counted) return;
                counter.dataset.counted = '1';
                const target = parseInt(counter.getAttribute('data-count-target'), 10);
                const prefix = counter.getAttribute('data-count-prefix') || '';
                const suffix = counter.getAttribute('data-count-suffix') || '';
                let current = 0;
                const step = Math.max(1, Math.ceil(target / 28));
                const timer = setInterval(() => {
                  current += step;
                  if (current >= target) {
                    current = target;
                    clearInterval(timer);
                  }
                  counter.textContent = `${prefix}${current}${suffix}`;
                }, 28);
              });

              revealObserver.unobserve(entry.target);
            }
          });
        }, {
          rootMargin: '0px 0px -36px 0px',
          threshold: 0.08
        });

        document.querySelectorAll('.reveal').forEach(el => {
          revealObserver.observe(el);
        });
      } else {
        document.querySelectorAll('.reveal').forEach(el => {
          el.classList.add('is-visible');
        });
      }
    }
